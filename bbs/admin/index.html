<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLOVER 관리자 모드</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <script src="../../config.js?v=20260831-application-dashboard"></script>
  <style>
    :root {
      color-scheme: dark;
      --accent: #00ff40;
      --accent-soft: rgba(0, 255, 64, .16);
      --bg: #101010;
      --panel: #1f1f1f;
      --panel-2: #242424;
      --ink: #f7f9fb;
      --muted: #b8c0ca;
      --line: #303030;
      --shadow: 8px 10px 24px rgba(0,0,0,.35), -4px -4px 12px rgba(255,255,255,.03);
      --inset: inset 4px 4px 10px rgba(0,0,0,.45), inset -3px -3px 8px rgba(255,255,255,.04);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    .remote-top {
      display: grid;
      gap: 12px;
      padding-bottom: 4px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 3px 0 5px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: linear-gradient(145deg, #262626, #151515 68%);
      border: 1px solid rgba(255,255,255,.04);
      box-shadow: inset 5px 5px 11px rgba(0,0,0,.58), inset -4px -4px 9px rgba(255,255,255,.055), 6px 8px 16px rgba(0,0,0,.32);
    }
    .brand-mark img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 1px 0 rgba(255,255,255,.18)) drop-shadow(0 5px 9px rgba(0,0,0,.58));
      opacity: .98;
    }
    .brand-copy { min-width: 0; flex: 1 1 auto; }
    .brand strong {
      display: block;
      color: #f7f9fb;
      font-size: 21px;
      line-height: .95;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255,255,255,.14), 0 7px 14px rgba(0,0,0,.5);
    }
    .brand span {
      display: block;
      margin-top: 5px;
      color: #d8dde3;
      font-size: 11px;
      line-height: 1.1;
      font-weight: 900;
      text-shadow: 0 1px 0 rgba(255,255,255,.1), 0 5px 10px rgba(0,0,0,.45);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid #343434;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }
    .icon-btn:active {
      transform: translateY(1px);
      box-shadow: var(--inset);
    }
    .link-btn, .soft-btn, .toggle-btn, .nav-btn {
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--ink);
      box-shadow: var(--shadow);
      min-height: 48px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .link-btn:active, .soft-btn:active, .toggle-btn:active, .nav-btn:active {
      transform: translateY(1px);
      box-shadow: var(--inset);
    }
    .layout {
      width: min(1420px, calc(100% - 28px));
      margin: 14px auto 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
      gap: 16px;
      align-items: start;
    }
    main { min-width: 0; }
    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .remote-nav { display: grid; gap: 12px; }
    .nav-btn {
      --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='12' cy='12' r='7' fill='none' stroke='black' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2' fill='black'/%3E%3C/svg%3E");
      justify-content: flex-start;
      gap: 9px;
      width: 100%;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.04), 4px 5px 12px rgba(0, 0, 0, .28);
    }
    .nav-btn::before {
      content: "";
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      background: currentColor;
      opacity: .9;
      -webkit-mask: var(--nav-icon) center / contain no-repeat;
      mask: var(--nav-icon) center / contain no-repeat;
    }
    .nav-btn .count-pill {
      margin-left: auto;
    }
    .nav-btn[data-nav="hero"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='3' y='5' width='18' height='14' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3Ccircle cx='8.5' cy='10' r='1.5' fill='black'/%3E%3Cpath d='m21 15-5-5L5 19' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="schedule"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='4' y='5' width='16' height='16' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3Cpath d='M8 3v4M16 3v4M4 10h16' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="events"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 7h16M7 12h10M10 17h4' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='5' cy='7' r='2' fill='black'/%3E%3Ccircle cx='19' cy='12' r='2' fill='black'/%3E%3Ccircle cx='8' cy='17' r='2' fill='black'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="events2"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='4' y='4' width='7' height='7' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3Crect x='13' y='4' width='7' height='7' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3Crect x='4' y='13' width='7' height='7' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3Crect x='13' y='13' width='7' height='7' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="clover"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 6h14M5 11h14M5 16h9' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M17 16h2v2h-2z' fill='black'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="field"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 21s7-5 7-11a7 7 0 1 0-14 0c0 6 7 11 7 11z' fill='none' stroke='black' stroke-width='2'/%3E%3Ccircle cx='12' cy='10' r='2.5' fill='black'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="match"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 4h8v3a4 4 0 0 1-8 0V4z' fill='none' stroke='black' stroke-width='2'/%3E%3Cpath d='M6 4H4v2a4 4 0 0 0 4 4M18 4h2v2a4 4 0 0 1-4 4M12 11v5M9 20h6M10 16h4' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="counsel"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 5h14v10H8l-3 3V5z' fill='none' stroke='black' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M8 9h8M8 12h5' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="application"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='6' y='3' width='12' height='18' rx='2' fill='none' stroke='black' stroke-width='2'/%3E%3Cpath d='M9 8h6M9 12h6M9 16h3' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"); }
    .nav-btn[data-nav="board"] { --nav-icon: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 6h16v12H4z' fill='none' stroke='black' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='m4 7 8 6 8-6' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); }
    .nav-btn.is-active { outline: 2px solid var(--accent); background: #1f2b22; color: #fff; }
    .nav-group {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .nav-group:not(.is-open) .nav-submenu {
      display: none;
    }
    .nav-submenu {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid #303030;
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 4px 4px 10px rgba(0,0,0,.36), inset -2px -2px 7px rgba(255,255,255,.035);
    }
    .nav-submenu .page-head { gap: 4px; }
    .nav-submenu h1 { font-size: 18px; }
    .nav-submenu .sub { font-size: 11px; }
    .nav-submenu .metric {
      border-radius: 12px;
      background: #202020;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.035), 3px 4px 10px rgba(0,0,0,.22);
    }
    .nav-submenu .metric strong { font-size: 24px; }
    .nav-divider {
      height: 1px;
      margin: 4px 0;
      background: var(--line);
      opacity: .9;
    }
    .count-pill {
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      background: #050805;
      color: #fff;
      font-size: 12px;
    }
    .page-head {
      display: grid;
      gap: 7px;
      margin: 0;
    }
    h1 { margin: 0; font-size: 26px; line-height: 1.05; }
    .sub { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
    }
    .metric, .panel, .event-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .metric { min-width: 0; padding: 12px 10px; }
    .metric span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 8px; white-space: nowrap; }
    .metric strong { font-size: 28px; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0;
    }
    .toolbar .search { grid-column: 1 / -1; }
    .search {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 16px;
      outline: 0;
      box-shadow: inset 2px 2px 6px rgba(0, 0, 0, .28);
    }
    .panel { padding: 14px; }
    .admin-panel[hidden] { display: none !important; }
    .dashboard-panel {
      display: grid;
      gap: 12px;
    }
    .dashboard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 2px;
    }
    .dashboard-head h1 {
      font-size: 22px;
    }
    .dashboard-head-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .dashboard-list {
      display: grid;
      gap: 10px;
    }
    .dashboard-maker {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(0, 255, 64, .22);
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 12px 24px rgba(0,0,0,.2);
    }
    .dashboard-maker[hidden] {
      display: none !important;
    }
    .dashboard-maker-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .dashboard-maker .create-btn {
      width: auto;
      min-height: 42px;
      padding: 0 22px;
      font-size: 15px;
    }
    .hero-remote-form {
      display: grid;
      gap: 9px;
    }
    .remote-field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.35;
    }
    .remote-field input {
      min-height: 38px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #1f1f1f;
      color: var(--ink);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 900;
      outline: 0;
      box-shadow: inset 2px 2px 6px rgba(0,0,0,.24);
    }
    .hero-admin-tools {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-2);
      box-shadow: var(--shadow);
    }
    .hero-admin-list {
      display: grid;
      gap: 10px;
    }
    .hero-admin-item {
      position: relative;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: border-color .16s ease, box-shadow .16s ease, opacity .16s ease, transform .16s ease;
    }
    .hero-admin-item::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(0, 255, 64, .08), rgba(0, 255, 64, 1));
      box-shadow: 0 0 18px rgba(0, 255, 64, .75);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
      pointer-events: none;
    }
    .hero-admin-item::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
      min-width: 54px;
      padding: 5px 9px;
      border: 1px solid rgba(0, 255, 64, .45);
      border-radius: 999px;
      background: rgba(6, 16, 8, .9);
      color: var(--accent);
      font-size: 11px;
      font-weight: 950;
      line-height: 1;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,.34), 0 0 16px rgba(0,255,64,.28);
      opacity: 0;
      transform: translateY(-4px) scale(.96);
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .hero-admin-item.is-pressing {
      border-color: rgba(0, 255, 64, .48);
      box-shadow: 0 0 0 2px rgba(0, 255, 64, .12), 0 14px 26px rgba(0,0,0,.3);
      transform: scale(.997);
      cursor: grabbing;
    }
    .hero-admin-item.is-pressing::before {
      opacity: 1;
      animation: hold-progress .42s linear forwards;
    }
    .hero-admin-item.is-dragging {
      border-color: rgba(0, 255, 64, .9);
      background: #20251f;
      box-shadow: 0 0 0 3px rgba(0, 255, 64, .2), 0 22px 42px rgba(0,0,0,.42);
      opacity: .94;
      transform: translateY(-3px) scale(1.01);
      cursor: grabbing;
      z-index: 4;
    }
    .hero-admin-item.is-dragging::before {
      opacity: 1;
      transform: scaleX(1);
      animation: none;
    }
    .hero-admin-item.is-dragging::after {
      content: "이동 중";
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .hero-admin-item.is-pressing .hero-admin-rank,
    .hero-admin-item.is-dragging .hero-admin-rank {
      opacity: 0;
    }
    .hero-admin-item.is-dragging .hero-admin-thumb {
      box-shadow: inset 0 0 0 2px rgba(0, 255, 64, .52);
      filter: saturate(1.15) brightness(1.08);
    }
    .hero-admin-rank {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(0, 255, 64, .95);
      color: #061008;
      font-size: 11px;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(0,0,0,.26);
    }
    .hero-admin-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 10px;
      background: #252a31;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .hero-admin-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-admin-thumb.is-empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }
    .hero-admin-fields {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .hero-admin-field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }
    .hero-admin-field input {
      min-height: 38px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #1f1f1f;
      color: var(--ink);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 900;
      outline: 0;
    }
    .hero-admin-actions {
      display: grid;
      gap: 8px;
      justify-items: end;
      align-self: stretch;
      align-content: center;
      min-width: 72px;
    }
    .hero-admin-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #dfe5ec;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }
    .hero-admin-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    .hero-admin-hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
    }
    .dashboard-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-2);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.035), 4px 5px 12px rgba(0,0,0,.22);
    }
    .dashboard-item.has-thumb {
      grid-template-columns: 132px minmax(0, 1fr);
    }
    .dashboard-thumb {
      grid-row: 1 / span 4;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      overflow: hidden;
      background: #151515;
      border: 1px solid rgba(255,255,255,.06);
    }
    .dashboard-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dashboard-item strong {
      font-size: 15px;
      line-height: 1.25;
    }
    .dashboard-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .dashboard-episode-badge {
      min-width: 40px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      background: #161616;
      color: #f4f7fb;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.04);
      font-size: 13px;
      font-weight: 950;
      flex: 0 0 auto;
    }
    .dashboard-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .dashboard-item .dashboard-item-content {
      color: #c9d4e3;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .dashboard-item .dashboard-board-body {
      color: #eef5ff;
      font-size: 13px;
      font-weight: 800;
      white-space: pre-wrap;
    }

      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .schedule-date-calendar-title {
      font-size: 15px;
      font-weight: 950;
      color: var(--ink);
    }
    .schedule-date-calendar-nav {
      display: inline-flex;
      gap: 6px;
    }
    .schedule-date-calendar-nav button {
      width: 32px;
      height: 32px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #1f1f1f;
      color: var(--ink);
      font-weight: 950;
    }
    .schedule-date-week,
    .schedule-date-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }
    .schedule-date-week span {
      min-height: 22px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
    }
    .schedule-date-day {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 950;
    }
    .schedule-date-day.is-selected {
      border-color: #00ff40;
      background: rgba(0, 255, 64, .14);
      color: #7bff9b;
    }
    .schedule-date-day.is-muted {
      color: #505862;
    }
    .schedule-date-day.is-today {
      border-color: rgba(255,255,255,.22);
    }
    .schedule-layer-list {
      display: grid;
      gap: 10px;
    }
    .schedule-layer-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 16px;
      background: #242424;
      box-shadow: var(--shadow), inset 1px 1px 0 rgba(255, 255, 255, .045);
      cursor: pointer;
    }
    .schedule-layer-card:hover {
      border-color: rgba(0, 255, 64, .4);
    }
    .schedule-layer-card.is-selected {
      border-color: #00ff40;
      background: #1b2b1e;
      box-shadow: 0 0 0 2px rgba(0, 255, 64, .35), var(--shadow);
      position: relative;
    }
    .schedule-layer-card.is-selected::before {
      content: "수정 중";
      position: absolute;
      top: -9px;
      left: 14px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #00ff40;
      color: #07150b;
      font-size: 11px;
      font-weight: 950;
    }
    .schedule-layer-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 17px;
      line-height: 1.25;
    }
    .schedule-layer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .schedule-layer-meta span {
      padding: 4px 8px;
      border-radius: 999px;
      background: #252525;
      color: #dfe5ec;
    }
    .schedule-layer-meta .is-source {
      background: rgba(0, 255, 64, .12);
      color: #7bff9b;
    }
    .schedule-layer-card.is-default {
      border-color: rgba(255,255,255,.16);
      background: #242424;
      opacity: 1;
    }
    .schedule-layer-card.is-closed {
      border-color: rgba(255,255,255,.09);
      background: #1b1b1b;
      box-shadow: none;
      opacity: .72;
      filter: grayscale(.16);
    }
    .schedule-layer-card.is-closed .schedule-layer-meta span {
      background: #202020;
      color: #8f98a3;
    }
    .schedule-layer-episode {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.25rem;
      min-height: 1.45rem;
      margin-right: .35rem;
      padding: .1rem .45rem;
      border-radius: 999px;
      background: rgba(0, 255, 64, .14);
      color: #7bff9b;
      font-size: .78rem;
      font-weight: 950;
      vertical-align: .08rem;
    }
    .schedule-layer-card button:disabled {
      cursor: default;
      opacity: .6;
    }
    .schedule-card-actions {
      display: inline-flex;
      justify-content: flex-end;
      gap: 6px;
    }
    @media (max-width: 620px) {
      .edit-grid { grid-template-columns: 1fr; }
      .schedule-maker-head { align-items: stretch; flex-direction: column; }
      .schedule-maker-grid { grid-template-columns: 1fr; }
      .schedule-layer-card { grid-template-columns: 1fr; }
      .schedule-card-actions { justify-content: flex-start; }
      .hero-admin-item { grid-template-columns: 1fr; }
      .hero-admin-actions { justify-items: stretch; }
    }
    .link-btn, .soft-btn, .nav-btn, .small-btn { border-color: #343434; }
    .search { background: #1f1f1f; }
    @media (max-width: 640px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; grid-row: 1; max-height: none; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .event-card { grid-template-columns: 140px minmax(0, 1fr) 144px; }
      .event-actions { grid-column: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toast {
        right: 14px;
        left: 14px;
        min-width: 0;
      }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar .search { grid-column: auto; }
      .event-card { grid-template-columns: 120px minmax(0, 1fr); }
      .event-actions { grid-column: 1 / -1; width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>

    function applySavedOrder(list) {
      const savedOrder = readOrder();
      if (!savedOrder.length) return list;
      const rank = new Map(savedOrder.map((id, index) => [id, index]));
      return [...list].sort((a, b) => {
        const aRank = rank.has(a.id) ? rank.get(a.id) : Number.MAX_SAFE_INTEGER + a.order;
        const bRank = rank.has(b.id) ? rank.get(b.id) : Number.MAX_SAFE_INTEGER + b.order;
        return aRank - bRank;
      });
    }

    function updateEventOrders() {
      events.forEach((event, index) => {
        event.order = index + 1;
      });
    }

    async function saveEventsSequentially(list) {
      for (const event of list) {
        await apiPost(eventSavePayload(event));
      }
    }

    async function persistEventOrder() {
      updateEventOrders();
      writeOrder(events.map((event) => event.id));
      try {
        await saveEventsSequentially(events);
      } catch (error) {
        showToast(`순서 저장 실패: ${error.message}`);
      }
    }

    function isCustomEvent(event) {
      return String(event?.id || "").startsWith("clover-custom-event-");

        active: isActive(event)
      };

    function persistCustomEvents() {
      updateEventOrders();
      writeCustomEvents(events.filter(isCustomEvent).map(eventStorageData));
    }

    function moveEventTo(dragId, targetId, afterTarget = false) {
      if (!dragId || !targetId || dragId === targetId) return false;
      const before = events.map((event) => event.id).join("|");
      const from = events.findIndex((event) => event.id === dragId);
      if (from < 0) return false;
      const [moved] = events.splice(from, 1);
      const targetIndex = events.findIndex((event) => event.id === targetId);
      if (targetIndex < 0) {
        events.splice(from, 0, moved);
        return false;
      }
      events.splice(targetIndex + (afterTarget ? 1 : 0), 0, moved);
      if (events.map((event) => event.id).join("|") === before) return false;
      persistEventOrder();
      return true;
    }

    function isInteractiveReorderTarget(target) {

    function optimizedAssetPath(raw) {
      const match = raw.match(/^assets\/([^?#\/]+)\.(png|jpe?g)([?#].*)?$/i);
      if (!match) return raw;
      const name = match[1];
      if (/^(favicon|clover-logo)/i.test(name)) return raw;
      return `assets/optimized/${name}.webp${match[3] || ""}`;
    }

    function adminImageUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (/^data:image\//i.test(raw)) return raw;
      if (/^(https?:)?\/\//i.test(raw)) return raw;
      if (raw.startsWith("../../")) return raw;
      const optimized = optimizedAssetPath(raw.replace(/^\/+/, ""));
      return `../../${optimized}`;
    }

    function layerFormConfig(value, fallback) {
      if (value && typeof value === "object" && !Array.isArray(value)) return { ...fallback, ...value };
      if (typeof value === "string" && value.trim()) {
        try {
          const parsed = JSON.parse(value);
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return { ...fallback, ...parsed };
        } catch {}
      }
      return { ...fallback };
    }

    function eventPriceConfig(event) {
      const config = layerFormConfig(event?.form2Config, defaultLayerForm2Config);
      const prices = config.priceByComposition && typeof config.priceByComposition === "object" ? config.priceByComposition : {};
      const fallbackMale = event?.malePrice || event?.price || "99,000원";
      const fallbackFemale = event?.femalePrice || "30,000원";
      return {
        "1:1": {
          malePrice: prices["1:1"]?.malePrice || fallbackMale,
          femalePrice: prices["1:1"]?.femalePrice || fallbackFemale

          malePrice: prices["6:6"]?.malePrice || fallbackMale,
          femalePrice: prices["6:6"]?.femalePrice || fallbackFemale

        ...layerFormConfig(event?.form2Config, defaultLayerForm2Config),

    function normalizeAgeRangeText(value) {
      return String(value || "")
        .replace(/(\d+)\s*세\s*-\s*(\d+)\s*세/g, "$1 - $2세")
        .replace(/(\d+)\s*-\s*(\d+)\s*세/g, "$1 - $2세")
        .trim();
    }

    function dashboardAgeOptions() {
      const options = new Set(defaultLayerForm2Config.ageOptions || []);
      events.forEach((event) => {
        layerFormConfig(event.form2Config, defaultLayerForm2Config).ageOptions.forEach((option) => {
          const text = normalizeAgeRangeText(option);
          if (text) options.add(text);
        });
      });
      return [...options];
    }

    function renderDashboardAgeOptions() {
      document.querySelectorAll("[data-dashboard-age-select]").forEach((select) => {
        const current = normalizeAgeRangeText(select.value);
        const options = dashboardAgeOptions();
        if (current && !options.includes(current)) options.unshift(current);
        select.innerHTML = options.map((option) => `<option value="${htmlAttr(option)}">${htmlAttr(option)}</option>`).join("");
        select.value = options.includes(current) ? current : (options.includes("27 - 36세") ? "27 - 36세" : (options[0] || ""));
      });

    function moveHeroSlide(dragId, targetId, afterTarget = false) {
      if (!dragId || !targetId || dragId === targetId) return false;
      const before = heroSlides.map((item) => item.id).join("|");
      const from = heroSlides.findIndex((item) => String(item.id) === String(dragId));
      if (from < 0) return false;
      const [moved] = heroSlides.splice(from, 1);
      const targetIndex = heroSlides.findIndex((item) => String(item.id) === String(targetId));
      if (targetIndex < 0) {
        heroSlides.splice(from, 0, moved);
        return false;
      }
      heroSlides.splice(targetIndex + (afterTarget ? 1 : 0), 0, moved);
      heroSlides = heroSlides.map((item, index) => ({ ...item, order: index + 1 }));
      return heroSlides.map((item) => item.id).join("|") !== before;
    }

    function mergeDashboardBoardPosts(...groups) {
      const byKey = new Map();
      const statusOverrides = readDashboardBoardStatusOverrides();
      const authorOverrides = readDashboardBoardAuthorOverrides();
      groups.flat().filter(Boolean).forEach((post, index) => {
        const key = String(post.id || `board-${post.author || ""}-${post.createdAt || index}`);
        const current = byKey.get(key) || {};
        const author = Object.prototype.hasOwnProperty.call(authorOverrides, key) ? authorOverrides[key] : (post.author || current.author);
        byKey.set(key, {
          ...current,
          ...post,
          author: normalizeDashboardBoardAuthor(author),
          content: String(post.content || "").trim() || current.content || "",
          question: String(post.question || "").trim() || current.question || "",
          message: String(post.message || "").trim() || current.message || "",
          reply: post.reply || current.reply || "",
          followUp: post.followUp || current.followUp || "",
          replies: post.replies || current.replies || [],
          followUps: post.followUps || current.followUps || [],
          attachments: normalizeDashboardBoardAttachments(post.attachments).length ? normalizeDashboardBoardAttachments(post.attachments) : normalizeDashboardBoardAttachments(current.attachments),
          status: (post.status || current.status) === "완료" ? "완료" : (statusOverrides[key] || post.status || current.status || "접수")
        });
      });
      return [...byKey.values()].sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
    }

        let changed = false;
        const cleaned = cleanDashboardPosts(parsed).map((post) => {
          if (post?.isSaving !== true) return post;
          const savedAt = Number(post.updatedAt || post.createdAt || 0);
          if (savedAt && Date.now() - savedAt < 120000) return post;
          changed = true;
          return { ...post, isSaving: false, savingLabel: "" };
        });
        if (changed || cleaned.length !== parsed.length) {
          localStorage.setItem(DASHBOARD_CONTENT_CACHE_KEY, JSON.stringify(cleaned.slice(0, 120)));
        }
        return cleaned;
      } catch {
        return [];

    function scheduleTimeHour(time) {
      const text = String(time || "");
      const clockMatch = text.match(/(\d{1,2}):(\d{2})/);
      const match = clockMatch || text.match(/(\d{1,2})/);
      if (!match) return NaN;
      let hour = Number(match[1]);
      if (/오후/.test(text) && hour < 12) hour += 12;
      if (/오전/.test(text) && hour === 12) hour = 0;
      return hour >= 0 && hour <= 23 ? hour : NaN;
    }

    function scheduleTimeText(time) {
      const hour = scheduleTimeHour(time);
      if (Number.isNaN(hour)) return time || "";
      const period = hour < 12 ? "오전" : "오후";
      const displayHour = String(hour % 12 || 12).padStart(2, "0");
      return `${period} ${displayHour}:00`;
    }

    function dashboardDateInputValue(value) {
      const text = String(value || "").trim();
      const isoMatch = text.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
      const parsed = new Date(text);
      if (!Number.isNaN(parsed.getTime())) {
        return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
      }
      return "";
    }

    function dashboardTimeInputValue(value, fallbackHour = "") {
      const hour = scheduleTimeHour(value);
      if (!Number.isNaN(hour)) return `${String(hour).padStart(2, "0")}:00`;
      if (fallbackHour !== "") return `${String(fallbackHour).padStart(2, "0")}:00`;
      return "";
    }

    function scheduleEventTimestamp(iso, time) {
      const hour = scheduleTimeHour(time);
      if (!iso || Number.isNaN(hour)) return NaN;
      const [year, month, day] = String(iso).split("-").map(Number);
      if (!year || !month || !day) return NaN;
      return Date.UTC(year, month - 1, day, hour - 9, 0, 0);
    }

    function isScheduleClosed(post) {
      const eventTs = scheduleEventTimestamp(post.scheduleDate, post.scheduleTime);
      return !Number.isNaN(eventTs) && Date.now() >= eventTs;
    }

    function scheduleDateText(iso) {

      if (!year || !month || !day) return iso || "";
      const weekday = ["일", "월", "화", "수", "목", "금", "토"][new Date(`${iso}T00:00:00`).getDay()];
      return `${year}년 ${month}월 ${day}일(${weekday})`;

    function adminScheduleSlotsForDayOfWeek(dayOfWeek) {
      if (dayOfWeek === 5) return ["19시"];
      if (dayOfWeek === 6 || dayOfWeek === 0) return ["13시", "16시", "19시"];
      return [];
    }

    const SCHEDULE_EPISODE_BASE_ISO = "2026-09-04";

    function scheduleEpisodeNumber(post) {
      const iso = String(post?.scheduleDate || "").trim();
      const postHour = scheduleTimeHour(post?.scheduleTime);
      if (!iso || Number.isNaN(postHour)) return 1;
      const [by, bm, bd] = SCHEDULE_EPISODE_BASE_ISO.split("-").map(Number);
      const [y, m, d] = iso.split("-").map(Number);
      if (!y || !m || !d) return 1;
      const baseUtc = Date.UTC(by, bm - 1, bd);
      const targetUtc = Date.UTC(y, m - 1, d);
      if (targetUtc < baseUtc) return 0;
      const dayOffset = Math.round((targetUtc - baseUtc) / 86400000);
      let episode = 0;
      for (let i = 0; i < dayOffset; i += 1) {
        const dow = new Date(baseUtc + i * 86400000).getUTCDay();
        episode += adminScheduleSlotsForDayOfWeek(dow).length;
      }
      const todaySlots = adminScheduleSlotsForDayOfWeek(new Date(targetUtc).getUTCDay());
      const slotIndex = todaySlots.findIndex((time) => scheduleTimeHour(time) === postHour);
      return episode + (slotIndex >= 0 ? slotIndex + 1 : 1);
    }

    function adminCalendarMonths() {
      const [year, month] = seoulTodayIso().split("-").map(Number);
      const first = new Date(year, month - 1, 1);
      return [0, 1, 2].map((offset) => {
        const date = new Date(first.getFullYear(), first.getMonth() + offset, 1);
        return { year: date.getFullYear(), month: date.getMonth() + 1 };
      });
    }

    function defaultAdminSchedulePosts() {
      const posts = [];
      const deletedSlots = readDeletedScheduleSlots();
      adminCalendarMonths().forEach(({ year, month }) => {
        const lastDate = new Date(year, month, 0).getDate();
        for (let day = 1; day <= lastDate; day += 1) {
          const iso = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dayOfWeek = new Date(`${iso}T00:00:00`).getDay();
          adminScheduleSlotsForDayOfWeek(dayOfWeek).forEach((time) => {
            if (deletedSlots.has(scheduleSlotKey({ scheduleDate: iso, scheduleTime: time }))) return;
            posts.push({
              id: `placeholder-${iso}-${time}`,
              scheduleDate: iso,
              scheduleTime: time,
              meetingMode: "1:1",
              ageRange: "27-36세",
              active: true,
              source: "기본"
            });
          });
        }
      });
      return posts;
    }

    function scheduleSlotKey(post) {
      const hour = scheduleTimeHour(post.scheduleTime);
      const time = Number.isNaN(hour) ? String(post.scheduleTime || "") : `${hour}시`;
      return `${post.scheduleDate || ""}-${time}`;
    }

    function dashboardSchedulePosts() {
      const defaultPosts = defaultAdminSchedulePosts();
      const adminPosts = readAdminSchedulePosts().map((post) => ({ ...post, source: "관리자" }));
      const adminSlotKeys = new Set(adminPosts.map(scheduleSlotKey));
      return [
        ...defaultPosts.filter((post) => !adminSlotKeys.has(scheduleSlotKey(post))),
        ...adminPosts
      ].sort((a, b) => {
        const dateCompare = String(a.scheduleDate || "").localeCompare(String(b.scheduleDate || ""));
        if (dateCompare) return dateCompare;
        return (scheduleTimeHour(a.scheduleTime) || 0) - (scheduleTimeHour(b.scheduleTime) || 0);
      }).map((post) => {
        const episode = scheduleEpisodeNumber(post);
        return {
        ...post,
        displayEpisodeNumber: episode,
        displayEpisode: episode ? `${episode}화` : "",
        closed: isScheduleClosed(post)
        };
      });
    }

    let naverMapScriptPromise = null;
    function loadNaverMapScript() {
      if (window.naver?.maps?.Service) return Promise.resolve();
      if (naverMapScriptPromise) return naverMapScriptPromise;
      naverMapScriptPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(naverMapClientId)}&submodules=geocoder`;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("네이버 지도를 불러오지 못했습니다."));
        document.head.appendChild(script);
      });
      return naverMapScriptPromise;
    }

    function geocodeAddress(address) {
      return new Promise((resolve, reject) => {
        if (!naver.maps.Service || !naver.maps.Service.geocode) {
          reject(new Error("geocoder submodule not loaded"));
          return;
        }
        naver.maps.Service.geocode({ query: address }, (status, response) => {
          if (status !== naver.maps.Service.Status.OK || !response?.v2?.addresses?.length) {
            reject(new Error("geocode failed"));
            return;
          }
          const item = response.v2.addresses[0];
          resolve({ lat: Number(item.y), lng: Number(item.x), roadAddress: item.roadAddress || item.jibunAddress || address });
        });
      });
    }

    function normalizeScheduleAddress(address) {
      const text = String(address || "").trim().replace(/\s+/g, " ");
      if (!text) return "";
      if (/^(부산|서울|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)/.test(text)) return text;
      if (/부산진구|서전로|전포|부전/.test(text)) return `부산 부산진구 ${text}`.replace(/\s+/g, " ");
      return text;
    }

      const address = normalizeScheduleAddress(form.get("address")) || "부산 부산진구 서전로 8번길 27";
      const mapImageUrl = String(form.get("mapImageUrl") || "").trim();
      const mapImageFileInput = formEl.querySelector('input[type="file"][name="mapImageFile"]');
      if (mapImageFileInput?.files?.[0] && !mapImageFileInput.dataset.imagePayloads) await handleScheduleImageFiles(mapImageFileInput);
      const mapImageFiles = mapImageFileInput?.dataset.imagePayloads ? JSON.parse(mapImageFileInput.dataset.imagePayloads).filter(Boolean).slice(0, 5) : [];
      const content = String(form.get("content") || "").trim() || "자세한 사항은 개별적으로 문자 안내드릴 예정입니다.";
      const active = form.get("active") !== "false";
      const wasEditing = !!editingScheduleId;
      const deletedSlots = readDeletedScheduleSlots();
      try {
        const savedPosts = [];
        for (const time of times) {
          const id = schedulePostId(date, time);
          deletedSlots.delete(scheduleSlotKey({ scheduleDate: date, scheduleTime: time }));
          const result = await apiPost({
            type: "schedulePostSave",
            id,
            category: "일정 안내",
            title: `${date} ${time} 소개팅 안내`,
            content,
            imageUrl: DASHBOARD_FIELD_IMAGES[0],
            scheduleDate: date,
            scheduleTime: time,
            meetingMode,
            ageRange,
            address,
            mapImageUrl,
            mapImageFiles,
            active
          });
          if (result.post) savedPosts.push(result.post);
        }
        writeDeletedScheduleSlots(deletedSlots);
        if (savedPosts.length) {
          const currentCache = readSharedDashboardCache(PUBLIC_SCHEDULE_CACHE_KEY);
          const savedIds = new Set(savedPosts.map((post) => String(post.id || "")));
          writeSharedDashboardCache(PUBLIC_SCHEDULE_CACHE_KEY, uniqueDashboardItems([...savedPosts, ...currentCache.filter((post) => !savedIds.has(String(post.id || "")))]));
        }
        editingScheduleId = "";
        scheduleFormSubmitButtonText("생성");
        await loadAdminSchedulePosts();
        showToast(`${date} 일정 안내 ${times.length}개 ${wasEditing ? "수정" : "저장"}됨`);
      } catch (error) {
        showToast(`저장 실패: ${error.message}`);
      }
    }

    function render() {

      const rotationFiltered = eventsForLayer("rotation").filter((event) => eventMatchesSearch(event, q));

    function dashboardMatchDisplayTitle(item, fallback) {
      const rawTitle = String(item?.title || fallback || "소개팅 종료").trim().replace(/^\d+\s*화\s*/, "") || "소개팅 종료";
      const date = dashboardDateInputValue(item?.scheduleDate || item?.date || "");
      if (!date) return rawTitle;
      const [year, month, day] = date.split("-").map(Number);
      if (!year || !month || !day) return rawTitle;
      const time = scheduleTimeText(dashboardTimeInputValue(item?.scheduleTime, item?.hour || 19));
      return `[${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")} ${time}] ${rawTitle}`;
    }

    function dashboardMatchEpisode(item) {
      const titleMatch = String(item?.title || "").match(/(\d+)\s*화/);
      if (titleMatch) return Number(titleMatch[1]);
      const idMatch = String(item?.id || "").match(/(?:match|episode)[^\d]*(\d+)/i);
      if (idMatch) return Number(idMatch[1]);
      return Number(item?.episode) || "";
    }

    function nextDashboardMatchEpisode() {
      const episodes = (dashboardData.match || [])
        .map((item) => Number(dashboardMatchEpisode(item)))
        .filter((episode) => Number.isFinite(episode) && episode > 0);
      return episodes.length ? Math.max(...episodes) + 1 : 1;
    }

    function setDashboardMatchEpisodeField(form, value) {
      const episodeInput = form?.querySelector('[name="episode"]');
      if (!episodeInput) return;
      episodeInput.readOnly = true;
      episodeInput.value = value || nextDashboardMatchEpisode();
    }

    function setDashboardMatchDefaults(form) {
      if (!form) return;
      const titleInput = form.querySelector('[name="title"]');
      const timeInput = form.querySelector('[name="scheduleTime"]');
      if (titleInput && !String(titleInput.value || "").trim()) titleInput.value = "소개팅 종료";
      if (timeInput && !String(timeInput.value || "").trim()) timeInput.value = "19:00";
    }

    function dashboardEditableTitle(item, name) {
      const title = String(item?.title || item?.headline || item?.eventTitle || item?.name || item?.author || dashboardPanelCategories[name] || "").trim();
      if (name !== "match") return title;
      return title.replace(/^\d+\s*화\s*/, "").replace(/^\[[^\]]+\]\s*/, "") || "소개팅 종료";
    }

    function dashboardItemTitle(item, fallback) {
      if (String(item?.category || "").trim() === "매칭결과") {
        return dashboardMatchDisplayTitle(item, fallback);
      }
      return item.title || item.headline || item.eventTitle || item.name || item.author || fallback;
    }

    function dashboardItemBody(item) {
      let body = item.content || item.summary || item.message || item.target || item.applicationNote || item.question || "";
      if (String(item?.category || "").trim() !== "매칭결과") return body;
      body = String(body).replace(/\s*·\s*남\s*\d+\s*\/\s*여\s*\d+/g, "").replace(/\s*·\s*남\s*\d+\s*·\s*여\s*\d+/g, "");
      const details = [
        item.ageRange || item.age ? `${item.ageRange || item.age}` : "",
        item.matchCount !== undefined && item.matchCount !== "" && !/매칭\s*\d+\s*명/.test(String(body)) ? `매칭 ${item.matchCount}명` : "",
        item.male !== undefined && item.male !== "" ? `남 ${item.male}` : "",
        item.female !== undefined && item.female !== "" ? `여 ${item.female}` : ""
      ].filter(Boolean).join(" · ");
      return details ? `${body} · ${details}` : body;
    }

    function dashboardBoardMessages(value, role) {
      if (Array.isArray(value)) {
        return value.map((item) => ({
          role: item?.role || role || "",
          text: String(item?.text || "").trim(),
          createdAt: Number(item?.createdAt) || 0,
          updatedAt: Number(item?.updatedAt) || 0
        })).filter((item) => item.text);
      }
      const raw = String(value || "").trim();
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return dashboardBoardMessages(parsed, role);
      } catch {}
      return [{ role: role || "", text: raw, createdAt: 0, updatedAt: 0 }];
    }

    function normalizeDashboardBoardAttachments(value) {
      if (Array.isArray(value)) {
        return value.map((file) => ({
          name: String(file?.name || "첨부 파일").trim() || "첨부 파일",
          url: String(file?.url || "").trim(),
          mimeType: String(file?.mimeType || "").trim(),
          size: Number(file?.size) || 0
        })).filter((file) => file.url);
      }
      const raw = String(value || "").trim();
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return normalizeDashboardBoardAttachments(parsed);
      } catch {}
      return [{ name: "첨부 파일", url: raw, mimeType: "", size: 0 }];
    }

    function dashboardBoardMessageTime(message) {
      const time = Number(message?.updatedAt || message?.createdAt || 0);
      return time ? new Date(time).toLocaleString("ko-KR") : "";
    }

    function dashboardBoardMessageHtml(kind, title, text, message = {}, extra = "") {
      const time = dashboardBoardMessageTime(message);
      return `
        <div class="dashboard-board-message is-${htmlAttr(kind)}">
          <div class="dashboard-board-message-head">
            <span class="dashboard-board-message-title">${htmlAttr(title)}</span>
            ${time ? `<span class="dashboard-board-message-time">${htmlAttr(time)}</span>` : ""}
          </div>
          <p class="dashboard-board-message-text">${htmlAttr(text || "-")}</p>
          ${extra}
        </div>
      `;
    }

    function dashboardBoardAttachmentsHtml(attachments) {
      const files = normalizeDashboardBoardAttachments(attachments);
      if (!files.length) return "";
      const links = files.map((file, index) => `
        <li><a href="${htmlAttr(file.url)}" target="_blank" rel="noopener">${htmlAttr(file.name || `첨부 파일 ${index + 1}`)}</a></li>
      `).join("");
      return `
        <div class="dashboard-board-message is-original">
          <div class="dashboard-board-message-head">
            <span class="dashboard-board-message-title">첨부 파일</span>
          </div>
          <ul class="dashboard-board-attachments">${links}</ul>
        </div>
      `;
    }

    function dashboardBoardReplyHtml(message, index) {
      const edit = `<button class="small-btn" type="button" data-dashboard-board-reply-edit="${htmlAttr(index)}">수정</button>`;
      return dashboardBoardMessageHtml("admin", `관리자 답변 ${index + 1}`, message.text, message, edit);

    function dashboardBoardStatus(item) {
      const status = String(item.status || "").trim();
      if (dashboardBoardMessages(item.replies || item.reply, "admin").length) return "완료";
      return ["접수", "확인"].includes(status) ? status : "접수";
    }

    function dashboardBoardNumberMap() {
      return new Map([...(dashboardData.board || [])]
        .sort((a, b) => (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0))
        .map((item, index) => [String(dashboardItemId(item)), index + 1]));
    }

    function dashboardBoardCardHtml(item, fallbackTitle) {
      const id = dashboardItemId(item);
      const isOpen = dashboardOpenBoardIds.has(String(id));
      const number = dashboardBoardNumberMap().get(String(id)) || "-";
      const content = String(item.content || item.question || item.message || "").trim();
      const replies = dashboardBoardMessages(item.replies || item.reply, "admin");
      const followUps = dashboardBoardMessages(item.followUps || item.followUp, "author");
      const attachments = normalizeDashboardBoardAttachments(item.attachments);
      const status = dashboardBoardStatus(item);
      const statusClass = status === "완료" ? "is-complete" : (status === "확인" ? "is-checked" : "");
      const author = String(item.author || "").trim();
      const category = String(item.category || fallbackTitle || "문의").trim();
      const authorTitle = author ? `${author}님의 ${category}` : category;
      const preview = content ? (content.length > 110 ? `${content.slice(0, 110)}...` : content) : "문의 내용이 아직 표시되지 않습니다. 새로고침 후에도 안 보이면 서버 스크립트를 배포해 주세요.";
      const createdAt = item.createdAt ? new Date(Number(item.createdAt)).toLocaleString("ko-KR") : "";
      const authorThread = followUps.map((message, index) => dashboardBoardMessageHtml("author", `작성자 추가글 ${index + 1}`, message.text, message)).join("");
      const adminThread = replies.map((message, index) => dashboardBoardReplyHtml(message, index)).join("");
      const latestReply = replies.length ? replies[replies.length - 1].text : "";
      const saveLabel = replies.length ? "답변 수정" : "답변 저장";
      return `
        <article class="dashboard-item dashboard-board-card${isOpen ? " is-open" : ""}" data-dashboard-item="${htmlAttr(id)}" data-dashboard-board-card="${htmlAttr(id)}">
          <button class="dashboard-board-toggle" type="button" data-dashboard-board-toggle="${htmlAttr(id)}" aria-expanded="${isOpen ? "true" : "false"}">
            <span class="dashboard-board-summary">
              <span class="dashboard-title-row"><span class="dashboard-episode-badge">${htmlAttr(number)}</span><strong>${htmlAttr(authorTitle)}</strong></span>
              <span class="dashboard-meta">${htmlAttr([category, createdAt].filter(Boolean).join(" · "))}</span>
              <span class="dashboard-board-body">${htmlAttr(preview)}</span>
            </span>
            <span class="dashboard-board-status ${statusClass}">${htmlAttr(status)}</span>
          </button>
          <div class="dashboard-board-details">
            ${dashboardBoardMessageHtml("original", "작성자 원문", content || "문의 내용이 아직 표시되지 않습니다.")}
            ${dashboardBoardAttachmentsHtml(attachments)}
            ${authorThread}
            ${adminThread}
            <div class="dashboard-board-reply-box${replies.length ? " is-edit-waiting" : ""}" data-dashboard-board-reply-box data-reply-index="${replies.length ? htmlAttr(replies.length - 1) : ""}">
              <span class="dashboard-board-reply-title">${replies.length ? "관리자 답변 수정" : "관리자 답변 작성"}</span>
              <textarea placeholder="관리자 답변을 입력해 주세요.">${htmlAttr(latestReply)}</textarea>
              <div class="dashboard-board-reply-actions">
                <span class="dashboard-board-reply-message" data-dashboard-board-reply-message>${replies.length ? "기본값은 마지막 답변입니다. 위 답변의 수정 버튼을 누르면 해당 답변을 수정합니다." : ""}</span>
                <button class="create-btn dashboard-board-save" type="button" data-dashboard-board-reply-save="${htmlAttr(id)}">${saveLabel}</button>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function dashboardItemRawBody(item) {
      return item.content || item.summary || item.message || item.target || item.applicationNote || item.question || "";
    }

    function dashboardItemMeta(item) {
      const category = String(item.category || "").trim();
      const scheduleDate = dashboardDateInputValue(item.scheduleDate || item.date || "");
      const scheduleTime = dashboardTimeInputValue(item.scheduleTime, item.hour || "");
      const createdAtText = item.createdAt ? new Date(item.createdAt).toLocaleString("ko-KR") : "";
      if (category === "매칭결과") {
        return [
          category,
          scheduleDate && scheduleDateText(scheduleDate),
          scheduleTime && scheduleTimeText(scheduleTime),
          createdAtText
        ].filter(Boolean).join(" · ");
      }
      return [
        category,
        item.status,
        scheduleDate && scheduleDateText(scheduleDate),
        scheduleTime && scheduleTimeText(scheduleTime),
        createdAtText
      ].filter(Boolean).join(" · ");
    }

    function dashboardCounselAuthorMeta(item) {
      const author = String(item?.author || "").trim();
      const details = [
        item?.stage ? `단계: ${item.stage}` : "",
        item?.gender ? `성별: ${item.gender}` : ""
      ].filter(Boolean);
      if (!author && !details.length) return "";
      return `
        <span class="dashboard-author-meta">
          ${author ? `<b>작성자: ${htmlAttr(author)}</b>` : ""}
          ${details.map((detail) => `<span>${htmlAttr(detail)}</span>`).join("")}
        </span>
      `;
    }

    function dashboardItemId(item) {
      return String(item?.id || item?.episode || "");
    }

      const value = String(id || "");
      return value.includes("fallback") || value.startsWith("placeholder-") || value.startsWith("schedule-placeholder-");
    }

    function dashboardApplicationStatusClass(status) {
      if (status === "승인") return "is-complete";
      if (status === "확인") return "is-checked";
      if (status === "취소") return "is-canceled";
      return "";
    }

    function dashboardApplicationTime(value) {
      const time = Number(value) || 0;
      return time ? new Date(time).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
    }

    function dashboardApplicationStepsHtml(id, status, itemIndex) {
      const steps = ["접수", "확인", "승인"];
      const activeIndex = Math.max(0, steps.indexOf(status));
      return `
        <div class="dashboard-application-steps is-step-${activeIndex}" role="group" aria-label="신청 상태 변경">

        </div>
      `;
    }

    function dashboardApplicationCardHtml(item, fallbackTitle, index) {
      const id = dashboardItemId(item) || [item?.submittedAt || "", item?.phone || "", item?.eventTitle || ""].join("|");

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("이미지를 읽지 못했습니다."));
        reader.readAsDataURL(file);
      });
    }

    function webpFileName(name) {
      const safeName = String(name || "image").replace(/\.[a-z0-9]+$/i, "") || "image";
      return `${safeName}.webp`;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("이미지를 읽지 못했습니다."));
        reader.readAsDataURL(blob);
      });
    }

    function canvasToWebpDataUrl(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(async (blob) => {
          if (!blob) {
            reject(new Error("이 브라우저에서 WebP 변환을 지원하지 않습니다."));
            return;
          }
          try {
            resolve(await blobToDataUrl(blob));
          } catch (error) {
            reject(error);
          }
        }, "image/webp", DASHBOARD_IMAGE_WEBP_QUALITY);
      });
    }

    async function optimizeImageFileToWebp(file) {
      const sourceUrl = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.decoding = "async";
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error("이미지를 최적화하지 못했습니다."));
          image.src = sourceUrl;
        });
        const sourceWidth = image.naturalWidth || image.width;
        const sourceHeight = image.naturalHeight || image.height;
        if (!sourceWidth || !sourceHeight) throw new Error("이미지 크기를 확인하지 못했습니다.");
        const scale = Math.min(1, DASHBOARD_IMAGE_OPTIMIZED_MAX_EDGE / Math.max(sourceWidth, sourceHeight));
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d", { alpha: true });
        if (!context) throw new Error("이미지를 최적화하지 못했습니다.");
        context.drawImage(image, 0, 0, width, height);
        const dataUrl = await canvasToWebpDataUrl(canvas);
        if (!dataUrl.startsWith("data:image/webp;base64,")) throw new Error("이 브라우저에서 WebP 변환을 지원하지 않습니다.");
        return dataUrl;
      } finally {
        URL.revokeObjectURL(sourceUrl);
      }
    }

    async function optimizeImagePayloadToWebp(payload) {
      if (!payload?.base64) return null;
      if (String(payload.mimeType || "").toLowerCase() === "image/webp") return payload;
      const sourceType = String(payload.mimeType || "image/png");
      const dataUrl = `data:${sourceType};base64,${payload.base64}`;
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error("이미지를 최적화하지 못했습니다."));
        image.src = dataUrl;
      });
      const sourceWidth = image.naturalWidth || image.width;
      const sourceHeight = image.naturalHeight || image.height;
      if (!sourceWidth || !sourceHeight) throw new Error("이미지 크기를 확인하지 못했습니다.");
      const scale = Math.min(1, DASHBOARD_IMAGE_OPTIMIZED_MAX_EDGE / Math.max(sourceWidth, sourceHeight));
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { alpha: true });
      if (!context) throw new Error("이미지를 최적화하지 못했습니다.");
      context.drawImage(image, 0, 0, width, height);
      const optimizedDataUrl = await canvasToWebpDataUrl(canvas);
      return imagePayloadFromDataUrl(
        { name: webpFileName(payload.name), type: "image/webp" },
        optimizedDataUrl
      );
    }

    async function handleDashboardImageFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("이미지 파일만 첨부할 수 있습니다.");
        input.value = "";
        return;
      }
      if (file.size > DASHBOARD_IMAGE_FILE_MAX_SIZE) {
        showToast("이미지는 최대 200MB까지 첨부할 수 있습니다.");
        input.value = "";
        return;
      }
      try {
        const form = input.closest("[data-dashboard-maker]");
        const urlInput = form?.querySelector('[name="imageUrl"]');
        const dataUrl = await optimizeImageFileToWebp(file);
        input.dataset.imageDataUrl = dataUrl;
        input.dataset.imagePayload = JSON.stringify(imagePayloadFromDataUrl({ name: webpFileName(file.name), type: "image/webp" }, dataUrl));
        if (urlInput && !String(urlInput.value || "").trim()) urlInput.placeholder = "현재 상태 업로드 시 WebP로 최적화됩니다.";
        showToast("첨부 이미지가 WebP로 최적화되었습니다.");
      } catch (error) {
        showToast(error.message);
      }
    }

    async function handleScheduleImageFiles(input) {
      const files = Array.from(input.files || []).slice(0, 5);
      if (!files.length) return;
      if (files.some((file) => !file.type.startsWith("image/"))) {
        showToast("이미지 파일만 첨부할 수 있습니다.");
        input.value = "";
        return;
      }
      if (files.some((file) => file.size > DASHBOARD_IMAGE_FILE_MAX_SIZE)) {
        showToast("이미지는 파일당 최대 200MB까지 첨부할 수 있습니다.");
        input.value = "";
        return;
      }
      try {
        const payloads = [];
        const previews = [];
        for (const file of files) {
          const dataUrl = await optimizeImageFileToWebp(file);
          previews.push(dataUrl);
          payloads.push(imagePayloadFromDataUrl({ name: webpFileName(file.name), type: "image/webp" }, dataUrl));
        }
        input.dataset.imageDataUrl = previews[0] || "";
        input.dataset.imagePayload = JSON.stringify(payloads[0] || null);
        input.dataset.imagePayloads = JSON.stringify(payloads);
        showToast(`이미지 ${payloads.length}장이 WebP로 최적화되었습니다.`);
      } catch (error) {
        showToast(error.message);
      }
    }

    function imagePayloadFromDataUrl(file, dataUrl) {
      const text = String(dataUrl || "");
      const match = text.match(/^data:([^;]+);base64,(.+)$/);
      return {
        name: file?.name || "image.png",
        mimeType: match ? match[1] : (file?.type || "image/png"),
        base64: match ? match[2] : text
      };
    }

          .filter((item) => dashboardItemId(item));
        const posts = await Promise.all(sourcePosts.map((item, index) => dashboardPostPayloadForUpload(item, name, index + 1)));
        const invalid = posts.find((post) => !post.title || (name !== "match" && !post.imageUrl && !post.imageFile?.base64) || (String(post.imageUrl || "").startsWith("data:") && !post.imageFile?.base64));
        if (invalid) {
          showToast("이미지를 첨부하거나 Cloudinary URL 또는 assets 경로를 입력해 주세요.");
          return;
        }
        showToast(`${category} 현재 상태를 구글 시트에 업로드 중입니다.`);
        const result = await apiPost({
          type: "schedulePostReplaceCategory",
          category,
          posts
        });
        if (Array.isArray(result.posts)) {
          applyDashboardSchedulePosts(result.posts);
          replaceSharedDashboardCategoryCache(category, result.posts);
          replaceDashboardLocalCategoryCache(category, result.posts);
        }
        renderContentDashboards();
        showToast(`${category} ${Number(result.count) || posts.length}개를 구글 시트에 반영했습니다.`);
      } catch (error) {
        showToast(`업로드 실패: ${error.message}`);
      }
    }

    async function saveDashboardPost(form) {
      const name = form.dataset.dashboardMaker;
      const isEditing = Boolean(String(form.querySelector('[name="id"]')?.value || dashboardEditingIds[name] || "").trim());
      const savingLabel = isEditing ? "수정 중" : "추가 중";
      const submitButton = form.querySelector('button[type="submit"]');
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = isEditing ? "수정 중" : "등록 중";
      }
      let post;
      try {
        await ensureDashboardImageFileReady(form);
        post = dashboardPostFromForm(form);
      } catch (error) {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = isEditing ? "수정" : "등록";
        }
        showToast(error.message || "입력 내용을 확인해 주세요.");
        return;
      }
      if (name === "counsel") {
        resetDashboardForm(name);
        dashboardLoading = true;
        renderContentDashboards();
        try {
          const result = await apiPost({
            type: "counselCreate",
            visitorId: "admin-dashboard",
            author: "관리자",
            title: post.title,
            stage: post.stage || "관심 단계",
            content: post.content,
            gender: ""
          });
          if (result.post) {
            dashboardData.counsel = [result.post, ...(dashboardData.counsel || [])];
            writeSharedDashboardCache(PUBLIC_COUNSEL_CACHE_KEY, dashboardData.counsel);
          }
          await loadContentDashboards("counsel");
          showToast("관리자 연애상담 글을 등록했습니다.");
        } catch (error) {
          dashboardLoading = false;
          renderContentDashboards();
          showToast(`등록 실패: ${error.message}`);
        }
        return;
      }
      post.isSaving = true;
      post.savingLabel = savingLabel;
      upsertDashboardLocalPost(post);
      resetDashboardForm(name);
      applyLocalDashboardFallbacks();
      publishDashboardCategoryCache(name);
      renderContentDashboards();
      try {
        let serverSynced = false;
        if (GOOGLE_SCRIPT_URL) {
          if (!String(post.imageUrl || "").startsWith("data:")) {
            const result = await apiPost({
              type: "schedulePostSave",
              ...dashboardPostPayload(post, name, 1),
              imageFile: post.imageFile || null,
              order: 1
            });
            const savedPost = result.post || post;
            upsertDashboardLocalPost({ ...post, ...savedPost, title: post.title, content: post.content, imageUrl: savedPost.imageUrl || post.imageUrl, attachedImageUrl: "", imageFile: null, isSaving: false, savingLabel: "", ageRange: post.ageRange, male: post.male, female: post.female, matchCount: post.matchCount });
            serverSynced = true;
            await loadContentDashboards(name);
            publishDashboardCategoryCache(name);
          }
        }
        if (!serverSynced) {
          upsertDashboardLocalPost({ ...post, imageFile: null, isSaving: false, savingLabel: "" });
          applyLocalDashboardFallbacks();
          publishDashboardCategoryCache(name);
          renderContentDashboards();
        }
        showToast(`${dashboardPanelCategories[name]} 레이어를 저장했습니다.`);
      } catch (error) {
        upsertDashboardLocalPost({ ...post, isSaving: false, savingLabel: "" });
        applyLocalDashboardFallbacks();
        publishDashboardCategoryCache(name);
        renderContentDashboards();
        showToast(`서버 저장 실패, 로컬에는 반영됨: ${error.message}`);
      }
    }

    async function toggleDashboardPost(name, id) {
      const item = (dashboardData[name] || []).find((entry) => dashboardItemId(entry) === String(id));
      if (!item) return;
      const nextPost = {
        ...item,
        id: dashboardItemId(item),
        category: dashboardPanelCategories[name],
        title: dashboardItemTitle(item, dashboardPanelCategories[name] || ""),
        content: dashboardItemRawBody(item),

    function applyDashboardBoardReply(id, reply, replyIndex = "", result = {}) {
        const item = (dashboardData.board || []).find((post) => dashboardItemId(post) === id);
        const replies = Array.isArray(result.replies) ? result.replies : dashboardBoardMessages(item?.replies || item?.reply, "admin");
        if (!Array.isArray(result.replies)) {
          const target = Number(replyIndex);
          if (Number.isFinite(target) && target >= 0 && target < replies.length) replies[target] = { ...replies[target], text: reply, updatedAt: Date.now() };
          else replies.push({ role: "admin", text: reply, createdAt: Date.now(), updatedAt: 0 });
        }
        if (item) {
          item.reply = result.reply || (replies.length ? replies[replies.length - 1].text : reply);
          item.replies = replies;
          item.status = result.status || "완료";
        }
        writeDashboardBoardStatusOverride(id, "완료");
        writeSharedDashboardCache(PUBLIC_BOARD_CACHE_KEY, dashboardData.board);
        renderContentDashboards();
        const reopened = document.querySelector(`[data-dashboard-board-card="${CSS.escape(id)}"]`);
        if (reopened) {
          dashboardOpenBoardIds.add(String(id));
          reopened.classList.add("is-open");
          reopened.querySelector("[data-dashboard-board-toggle]")?.setAttribute("aria-expanded", "true");
          const reopenedMessage = reopened.querySelector("[data-dashboard-board-reply-message]");
          if (reopenedMessage) reopenedMessage.textContent = "답변이 저장되었습니다.";
        }
    }

    async function saveDashboardBoardReply(card) {
      if (!card) return;
      const id = String(card.dataset.dashboardBoardCard || card.dataset.dashboardItem || "").trim();
      const box = card.querySelector("[data-dashboard-board-reply-box]");
      const textarea = box?.querySelector("textarea");
      const button = card.querySelector("[data-dashboard-board-reply-save]");
      const message = card.querySelector("[data-dashboard-board-reply-message]");
      const reply = String(textarea?.value || "").trim();
      if (!id || !textarea || !button) return;
      if (!reply) {
        if (message) message.textContent = "답변을 입력해 주세요.";
        textarea.focus();
        return;
      }
      const replyIndex = String(box?.dataset.replyIndex || "").trim();
      const originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = "저장 중";
      try {
        const payload = { type: "boardReply", id, reply };
        if (replyIndex !== "") payload.replyIndex = Number(replyIndex);
        const result = await apiPost(payload);
        applyDashboardBoardReply(id, reply, replyIndex, result);
        showToast("문의 답변을 저장했습니다.");
      } catch (error) {
        const errorText = String(error?.message || "");
        if (/본인 사진|지원하지 않는 요청/i.test(errorText)) {
          applyDashboardBoardReply(id, reply, replyIndex, { status: "완료" });
          showToast("문의 답변을 저장했습니다.");
        } else {
          if (message) message.textContent = errorText || "답변 저장에 실패했습니다.";
          showToast(`답변 저장 실패: ${errorText || "알 수 없는 오류"}`);
        }
      } finally {
        button.disabled = false;
        button.textContent = originalLabel;
      }
    }

    function setDashboardBoardStatusOnCard(card, status) {
      const badge = card?.querySelector(".dashboard-board-status");
      if (!badge) return;
      badge.textContent = status;
      badge.classList.toggle("is-complete", status === "완료");
      badge.classList.toggle("is-checked", status === "확인");
    }

    function setDashboardApplicationStatusOnCard(card, status) {
      const badge = card?.querySelector(".dashboard-board-status");
      if (badge) {
        badge.textContent = status;
        badge.className = `dashboard-board-status ${dashboardApplicationStatusClass(status)}`.trim();
      }
      const steps = ["접수", "확인", "승인"];
      const index = Math.max(0, steps.indexOf(status));
      const stepBar = card?.querySelector(".dashboard-application-steps");
      if (stepBar) {
        stepBar.classList.remove("is-step-0", "is-step-1", "is-step-2");
        stepBar.classList.add(`is-step-${index}`);
      }
      card?.querySelectorAll("[data-dashboard-application-status]").forEach((button) => {
        const stepIndex = steps.indexOf(button.dataset.dashboardApplicationStatus);
        button.classList.toggle("is-done", stepIndex >= 0 && stepIndex <= index);
      });
    }

    async function updateDashboardApplicationStatus(id, status, card) {
      const applications = dashboardData.application || [];
      const itemIndex = Number(card?.dataset.dashboardApplicationIndex);
      const item = Number.isInteger(itemIndex) && applications[itemIndex]
        ? applications[itemIndex]
        : applications.find((application) => dashboardItemId(application) === String(id));
      if (!item || !["접수", "확인", "승인"].includes(status) || item.status === "취소") return;
      const previousStatus = item.status || "접수";
      item.status = status;
      setDashboardApplicationStatusOnCard(card, status);
      writeSharedDashboardCache(PUBLIC_APPLICATION_CACHE_KEY, dashboardData.application);
      try {
        const result = await apiPost({
          type: "applicationStatusUpdate",
          rowNumber: item.rowNumber || card?.dataset.dashboardApplicationRow || "",
          visitorId: item.visitorId || "",
          submittedAt: item.submittedAt || "",
          eventTitle: item.eventTitle || "",
          eventDate: item.eventDate || "",
          selectedAgeRange: item.selectedAgeRange || "",
          status
        });
        item.status = result.status || status;
        if (result.rowNumber) item.rowNumber = result.rowNumber;
        setDashboardApplicationStatusOnCard(card, item.status);
        writeSharedDashboardCache(PUBLIC_APPLICATION_CACHE_KEY, dashboardData.application);
        showToast(`신청 상태를 ${item.status}(으)로 변경했습니다.`);
      } catch (error) {
        item.status = previousStatus;
        setDashboardApplicationStatusOnCard(card, previousStatus);
        writeSharedDashboardCache(PUBLIC_APPLICATION_CACHE_KEY, dashboardData.application);
        showToast(`신청 상태 변경 실패: ${error.message}`);
      }
    }

      const card = event.target.closest(".event-card[data-event-id]");
      if (!card || isInteractiveReorderTarget(event.target)) return;
      clearPressTimer();
      pressingCardEl = card;
      pressingCardEl.classList.add("is-pressing");
      const startX = event.clientX;
      const startY = event.clientY;
      pressTimer = window.setTimeout(() => startReorder(card.dataset.eventId), 520);

      const cancelIfMoved = (moveEvent) => {
        if (!pressTimer) {
          window.removeEventListener("pointermove", cancelIfMoved);
          return;
        }
        const distance = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
        if (distance > 9) {
          clearPressTimer();
          window.removeEventListener("pointermove", cancelIfMoved);
        }
      };
      window.addEventListener("pointermove", cancelIfMoved, { passive: true });
      window.addEventListener("pointerup", () => window.removeEventListener("pointermove", cancelIfMoved), { once: true });
      window.addEventListener("pointercancel", () => window.removeEventListener("pointermove", cancelIfMoved), { once: true });
    }
