      const id = dashboardItemId(item);
      const manageable = !!dashboardPanelCategories[name] && !!id;
      const imageUrl = dashboardItemImageUrl(item, name);
      const active = item.active !== false;
      const episode = name === "match" ? dashboardMatchEpisode(item) : "";
      return `
        <article class="dashboard-item${imageUrl ? " has-thumb" : ""}${active ? "" : " is-off"}" data-dashboard-item="${htmlAttr(id)}">
          ${imageUrl ? `<span class="dashboard-thumb"><img src="${htmlAttr(adminImageUrl(imageUrl))}" alt="" loading="lazy"></span>` : ""}
          <span class="dashboard-title-row">${episode ? `<span class="dashboard-episode-badge">${htmlAttr(episode)}화</span>` : ""}<strong>${htmlAttr(title)}</strong></span>
          ${meta ? `<span class="dashboard-meta">${htmlAttr(meta)}</span>` : ""}
          ${body ? `<p>${htmlAttr(String(body)).slice(0, 180)}</p>` : ""}
          ${manageable ? `<span class="dashboard-item-actions"><button class="toggle-btn ${active ? "is-on" : "is-off"}" type="button" data-dashboard-toggle="${htmlAttr(id)}" data-dashboard-panel="${htmlAttr(name)}">${active ? "ON" : "OFF"}</button><button class="small-btn" type="button" data-dashboard-edit="${htmlAttr(id)}" data-dashboard-panel="${htmlAttr(name)}">수정</button><button class="small-btn danger-btn" type="button" data-dashboard-delete="${htmlAttr(id)}" data-dashboard-panel="${htmlAttr(name)}">삭제</button></span>` : ""}
        </article>
      `;
    }

    function renderDashboardList(name, fallbackTitle, emptyText) {
      const container = document.querySelector(`[data-dashboard-list="${name}"]`);
      if (!container) return;
      const form = dashboardForm(name);
      const panel = document.querySelector(`[data-admin-panel="${name}"]`);
      if (form && panel && form.parentElement === container) panel.insertBefore(form, container);
      if (dashboardLoading) {
        container.innerHTML = '<div class="dashboard-loading list-loading" role="status" aria-live="polite"><span class="list-loading-spinner"></span><span>불러오는 중입니다.</span></div>';
        return;
      }
      const list = dashboardData[name] || [];
      container.innerHTML = list.length
        ? list.map((item) => dashboardCardHtml(item, fallbackTitle, name)).join("")
        : `<div class="empty is-visible">${emptyText}</div>`;
      if (form && dashboardEditingIds[name]) {
        const card = container.querySelector(`[data-dashboard-item="${CSS.escape(String(dashboardEditingIds[name]))}"]`);
        if (card) {
          card.insertAdjacentElement("afterend", form);
          form.hidden = false;
        }
      }
    }

    function renderContentDashboards() {
      renderDashboardAgeOptions();
      renderDashboardList("clover", "클로버 근황", "등록된 클로버 근황이 없습니다.");
      renderDashboardList("field", "현장", "등록된 현장 게시물이 없습니다.");
      renderDashboardList("match", "매칭결과", "등록된 매칭결과 데이터가 없습니다.");
      renderDashboardList("counsel", "연애상담", "등록된 연애상담 글이 없습니다.");
      renderDashboardList("application", "신청 접수", "신청 접수 목록 API가 아직 연결되지 않았습니다.");
      renderDashboardList("board", "문의 하기", "등록된 문의가 없습니다.");
    }

    function dashboardForm(name) {
      return document.querySelector(`[data-dashboard-maker="${name}"]`);
    }

    function showDashboardForm(name) {
      const form = dashboardForm(name);
      if (form) form.hidden = false;
    }

    function hideDashboardForm(name) {
      const form = dashboardForm(name);
      if (form) form.hidden = true;
    }

    function resetDashboardForm(name) {
      const form = dashboardForm(name);
      if (!form) return;
      const list = document.querySelector(`[data-dashboard-list="${name}"]`);
      const panel = document.querySelector(`[data-admin-panel="${name}"]`);
      if (panel && list && form.parentElement !== panel) panel.insertBefore(form, list);
      form.reset();
      const idEl = form.querySelector('[name="id"]');
      if (idEl) idEl.value = "";
      const activeEl = form.querySelector('[name="active"]');
      if (activeEl) activeEl.value = "true";
      const imageFileInput = form.querySelector('input[type="file"][name="imageFile"]');
      if (imageFileInput) delete imageFileInput.dataset.imageDataUrl;
      if (name === "match") setDashboardMatchEpisodeField(form, nextDashboardMatchEpisode());
      const submit = form.querySelector('button[type="submit"]');
      if (submit) submit.textContent = "등록";
      delete dashboardEditingIds[name];
      hideDashboardForm(name);
    }

    function fillDashboardForm(name, item, card) {
      const form = dashboardForm(name);
      if (!form || !item) return;
      form.style.visibility = "hidden";
      if (card) card.insertAdjacentElement("afterend", form);
      showDashboardForm(name);
      dashboardEditingIds[name] = dashboardItemId(item);
      const fields = {
        id: dashboardItemId(item),
        episode: dashboardMatchEpisode(item),
        title: dashboardEditableTitle(item, name),
        content: dashboardItemRawBody(item),
        imageUrl: name === "match" ? "" : String(item.imageUrl || item.image || ""),
        scheduleDate: dashboardDateInputValue(item.scheduleDate || item.date || ""),
        scheduleTime: dashboardTimeInputValue(item.scheduleTime, item.hour || ""),
        ageRange: item.ageRange || item.age || "",
        male: item.male ?? "",
        female: item.female ?? "",
        matchCount: item.matchCount ?? "",
        active: item.active === false ? "false" : "true"
      };
      Object.entries(fields).forEach(([key, value]) => {
        const input = form.querySelector(`[name="${key}"]`);
        if (input) input.value = value;
      });
      if (name === "match") setDashboardMatchEpisodeField(form, fields.episode);
      const imageFileInput = form.querySelector('input[type="file"][name="imageFile"]');
      if (imageFileInput) delete imageFileInput.dataset.imageDataUrl;
      const submit = form.querySelector('button[type="submit"]');
      if (submit) submit.textContent = "수정";
      requestAnimationFrame(() => {
        form.style.visibility = "";
        if (card) card.scrollIntoView({ block: "nearest" });
      });
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("이미지를 읽지 못했습니다."));
        reader.readAsDataURL(file);
      });
    }

    async function handleDashboardImageFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("이미지 파일만 첨부할 수 있습니다.");
        input.value = "";
        return;
      }
      if (file.size > DASHBOARD_IMAGE_FILE_MAX_SIZE) {
        showToast("이미지는 최대 200MB까지 첨부할 수 있습니다.");
        input.value = "";
        return;
      }
      try {
        const form = input.closest("[data-dashboard-maker]");
        const urlInput = form?.querySelector('[name="imageUrl"]');
      const dataUrl = await fileToDataUrl(file);
        input.dataset.imageDataUrl = dataUrl;
        showToast("첨부 이미지가 적용되었습니다.");
      } catch (error) {
        showToast(error.message);
      }
    }

    function dashboardPostFromForm(form) {
      const name = form.dataset.dashboardMaker;
      const data = new FormData(form);
      const editingId = String(data.get("id") || dashboardEditingIds[name] || "").trim();
      const title = String(data.get("title") || "").trim();
      const content = String(data.get("content") || "").trim();
      const imageFileInput = form.querySelector('input[type="file"][name="imageFile"]');
      const attachedImageUrl = name === "match" ? "" : String(imageFileInput?.dataset.imageDataUrl || "").trim();
      const imageUrl = name === "match" ? "" : (String(data.get("imageUrl") || "").trim() || (name === "clover" ? "assets/clover-proof-01.jpg" : DASHBOARD_FIELD_IMAGES[0]));
      const ageRange = String(data.get("ageRange") || "").trim();
      const male = String(data.get("male") || "").trim();
      const female = String(data.get("female") || "").trim();
      const matchCount = String(data.get("matchCount") || "").trim();
      const existingItem = editingId ? (dashboardData[name] || []).find((item) => dashboardItemId(item) === editingId) : null;
      const episode = name === "match"
        ? String(existingItem ? dashboardMatchEpisode(existingItem) : nextDashboardMatchEpisode())
        : String(data.get("episode") || "").trim();
      const id = name === "match" ? (editingId || `dashboard-match-${episode}`) : (editingId || `dashboard-${name}-${Date.now()}`);
      if (!title) throw new Error("제목을 입력해 주세요.");
      if (!content) throw new Error("내용을 입력해 주세요.");
      return {
        id,
        episode,
        category: dashboardPanelCategories[name],
        title,
        content,
        imageUrl,
        attachedImageUrl,
        headline: name === "field" && /^\[소식\]/.test(title),
        active: data.get("active") !== "false",
        scheduleDate: dashboardDateInputValue(data.get("scheduleDate") || ""),
        scheduleTime: dashboardTimeInputValue(data.get("scheduleTime") || ""),
        ageRange,
        male,
        female,
        matchCount,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
    }

    async function saveDashboardPost(form) {
      const name = form.dataset.dashboardMaker;
      const post = dashboardPostFromForm(form);
      upsertDashboardLocalPost(post);
      resetDashboardForm(name);
      applyLocalDashboardFallbacks();
      renderContentDashboards();
      try {
        if (GOOGLE_SCRIPT_URL) {
          if (!String(post.imageUrl || "").startsWith("data:")) {
            const { attachedImageUrl, ...serverPost } = post;
            const result = await apiPost({
              type: "schedulePostSave",
              ...serverPost,
              order: 1
            });
            if (result.post) upsertDashboardLocalPost({ ...result.post, imageUrl: post.imageUrl, attachedImageUrl: post.attachedImageUrl, ageRange: post.ageRange, male: post.male, female: post.female, matchCount: post.matchCount });
            await loadContentDashboards();
          }
        }
        showToast(`${dashboardPanelCategories[name]} 레이어를 저장했습니다.`);
      } catch (error) {
        showToast(`서버 저장 실패, 로컬에는 반영됨: ${error.message}`);
      }
    }

    async function deleteDashboardPost(name, id) {
      deleteDashboardLocalPost(id);
      writeDashboardDeletedIds([...dashboardDeletedIds, id]);
      dashboardData[name] = (dashboardData[name] || []).filter((item) => dashboardItemId(item) !== String(id));
      renderContentDashboards();
      try {
        if (GOOGLE_SCRIPT_URL && !String(id).startsWith("dashboard-match-") && !String(id).includes("fallback")) {
          await apiPost({ type: "schedulePostDelete", id });
          await loadContentDashboards();
        }
        showToast(`${dashboardPanelCategories[name]} 레이어를 삭제했습니다.`);
      } catch (error) {
        showToast(`삭제 반영 중 오류: ${error.message}`);
      }
    }

    async function toggleDashboardPost(name, id) {
      const item = (dashboardData[name] || []).find((entry) => dashboardItemId(entry) === String(id));
      if (!item) return;
      const nextPost = {
        ...item,
        id: dashboardItemId(item),
        category: dashboardPanelCategories[name],
        title: dashboardItemTitle(item, dashboardPanelCategories[name] || ""),
        content: dashboardItemRawBody(item),
        imageUrl: name === "match" ? "" : String(item.imageUrl || item.image || ""),
        attachedImageUrl: name === "match" ? "" : String(item.attachedImageUrl || ""),
        episode: dashboardMatchEpisode(item),
        ageRange: item.ageRange || item.age || "",
        male: item.male ?? "",
        female: item.female ?? "",
        matchCount: item.matchCount ?? "",
        active: item.active === false
      };
      upsertDashboardLocalPost(nextPost);
      applyLocalDashboardFallbacks();
      renderContentDashboards();
      try {
        if (GOOGLE_SCRIPT_URL && !String(nextPost.imageUrl || "").startsWith("data:") && !String(id).startsWith("dashboard-match-") && !String(id).includes("fallback")) {
          const { attachedImageUrl, ...serverPost } = nextPost;
          await apiPost({
            type: "schedulePostSave",
            ...serverPost,
            order: 1
          });
          await loadContentDashboards();
        }
        showToast(`${dashboardPanelCategories[name]} 레이어 ${nextPost.active ? "ON" : "OFF"}`);
      } catch (error) {
        showToast(`서버 저장 실패, 로컬에는 반영됨: ${error.message}`);
      }
    }

    function applyDashboardBoardReply(id, reply, replyIndex = "", result = {}) {
        const item = (dashboardData.board || []).find((post) => dashboardItemId(post) === id);
        const replies = Array.isArray(result.replies) ? result.replies : dashboardBoardMessages(item?.replies || item?.reply, "admin");
        if (!Array.isArray(result.replies)) {
          const target = Number(replyIndex);
          if (Number.isFinite(target) && target >= 0 && target < replies.length) replies[target] = { ...replies[target], text: reply, updatedAt: Date.now() };
          else replies.push({ role: "admin", text: reply, createdAt: Date.now(), updatedAt: 0 });
        }
        if (item) {
          item.reply = result.reply || (replies.length ? replies[replies.length - 1].text : reply);
          item.replies = replies;
          item.status = result.status || "완료";
        }
        writeDashboardBoardStatusOverride(id, "완료");
        writeSharedDashboardCache(PUBLIC_BOARD_CACHE_KEY, dashboardData.board);
        renderContentDashboards();
        const reopened = document.querySelector(`[data-dashboard-board-card="${CSS.escape(id)}"]`);
        if (reopened) {
          reopened.classList.add("is-open");
          reopened.querySelector("[data-dashboard-board-toggle]")?.setAttribute("aria-expanded", "true");
          const reopenedMessage = reopened.querySelector("[data-dashboard-board-reply-message]");
          if (reopenedMessage) reopenedMessage.textContent = "답변이 저장되었습니다.";
        }
    }

    async function saveDashboardBoardReply(card) {
      if (!card) return;
      const id = String(card.dataset.dashboardBoardCard || card.dataset.dashboardItem || "").trim();
      const box = card.querySelector("[data-dashboard-board-reply-box]");
      const textarea = box?.querySelector("textarea");
      const button = card.querySelector("[data-dashboard-board-reply-save]");
      const message = card.querySelector("[data-dashboard-board-reply-message]");
      const reply = String(textarea?.value || "").trim();
      if (!id || !textarea || !button) return;
      if (!reply) {
        if (message) message.textContent = "답변을 입력해 주세요.";
        textarea.focus();
        return;
      }
      const replyIndex = String(box?.dataset.replyIndex || "").trim();
      const originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = "저장 중";
      try {
        const payload = { type: "boardReply", id, reply };
        if (replyIndex !== "") payload.replyIndex = Number(replyIndex);
        const result = await apiPost(payload);
        applyDashboardBoardReply(id, reply, replyIndex, result);
        showToast("문의 답변을 저장했습니다.");
      } catch (error) {
        const errorText = String(error?.message || "");
        if (/본인 사진|지원하지 않는 요청/i.test(errorText)) {
          applyDashboardBoardReply(id, reply, replyIndex, { status: "완료" });
          showToast("문의 답변을 저장했습니다.");
        } else {
          if (message) message.textContent = errorText || "답변 저장에 실패했습니다.";
          showToast(`답변 저장 실패: ${errorText || "알 수 없는 오류"}`);
        }
      } finally {
        button.disabled = false;
        button.textContent = originalLabel;
      }
    }

    function setDashboardBoardStatusOnCard(card, status) {
      const badge = card?.querySelector(".dashboard-board-status");
      if (!badge) return;
      badge.textContent = status;
      badge.classList.toggle("is-complete", status === "완료");
      badge.classList.toggle("is-checked", status === "확인");
    }

    async function markDashboardBoardChecked(id, card) {
      const item = (dashboardData.board || []).find((post) => dashboardItemId(post) === String(id));
      if (!item || dashboardBoardStatus(item) !== "접수") return;
      item.status = "확인";
      setDashboardBoardStatusOnCard(card, "확인");
      writeDashboardBoardStatusOverride(id, "확인");
      writeSharedDashboardCache(PUBLIC_BOARD_CACHE_KEY, dashboardData.board);
      try {
        if (GOOGLE_SCRIPT_URL) {
          const result = await apiPost({ type: "boardCheck", id });
          item.status = result.status || item.status;
          setDashboardBoardStatusOnCard(card, dashboardBoardStatus(item));
          writeDashboardBoardStatusOverride(id, dashboardBoardStatus(item));
          writeSharedDashboardCache(PUBLIC_BOARD_CACHE_KEY, dashboardData.board);
        }
      } catch (error) {
        if (!/본인 사진|지원하지 않는 요청/i.test(String(error.message || ""))) {
          showToast(`문의 확인 반영 실패: ${error.message}`);
        }
      }
    }

    function handleEventListClick(event) {
      const closeEdit = event.target.closest("[data-edit-close]");
      if (closeEdit) {
        closeEditModal();
        return;
      }
      const deleteButton = event.target.closest("[data-delete]");
      if (deleteButton) {
        const item = events.find((entry) => entry.id === deleteButton.dataset.delete);
        deleteEventLayer(item);
        return;
      }
      const toggle = event.target.closest("[data-toggle]");
      if (toggle) {
        const item = events.find((entry) => entry.id === toggle.dataset.toggle);
        if (item) setActive(item, !isActive(item));
        return;
      }
      const preview = event.target.closest("[data-preview]");
      if (preview) {
        window.open("../../index.html", "_blank", "noopener");
        return;
      }
      const edit = event.target.closest("[data-up]");
      if (edit) {
        const item = events.find((entry) => entry.id === edit.dataset.up);
        openEditModal(item);
        return;
      }
    }

    listEl.addEventListener("click", handleEventListClick);
    partyListEl?.addEventListener("click", handleEventListClick);

    function handleEventListPointerDown(event) {
      const card = event.target.closest(".event-card[data-event-id]");
      if (!card || isInteractiveReorderTarget(event.target)) return;
      clearPressTimer();
      pressingCardEl = card;
      pressingCardEl.classList.add("is-pressing");
      const startX = event.clientX;
      const startY = event.clientY;
      pressTimer = window.setTimeout(() => startReorder(card.dataset.eventId), 520);

      const cancelIfMoved = (moveEvent) => {
        if (!pressTimer) {
          window.removeEventListener("pointermove", cancelIfMoved);
          return;
        }
        const distance = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
        if (distance > 9) {
          clearPressTimer();
          window.removeEventListener("pointermove", cancelIfMoved);
        }
      };
      window.addEventListener("pointermove", cancelIfMoved, { passive: true });
      window.addEventListener("pointerup", () => window.removeEventListener("pointermove", cancelIfMoved), { once: true });
      window.addEventListener("pointercancel", () => window.removeEventListener("pointermove", cancelIfMoved), { once: true });
    }

    listEl.addEventListener("pointerdown", handleEventListPointerDown);
    partyListEl?.addEventListener("pointerdown", handleEventListPointerDown);

    window.addEventListener("pointermove", (event) => {
      if (!draggingEventId) return;
      event.preventDefault();
      const target = document.elementFromPoint(event.clientX, event.clientY);
      const card = target?.closest?.(".event-card[data-event-id]");
      if (!card || card.dataset.eventId === draggingEventId) return;
      const rect = card.getBoundingClientRect();
      const afterTarget = event.clientY > rect.top + rect.height / 2;
      if (moveEventTo(draggingEventId, card.dataset.eventId, afterTarget)) {
        didReorderDrag = true;
        render();
      }
    }, { passive: false });

    window.addEventListener("pointerup", finishReorder);
    window.addEventListener("pointercancel", finishReorder);
    window.addEventListener("scroll", clearPressTimer, true);

    searchEl.addEventListener("input", render);
    partySearchEl?.addEventListener("input", render);
    createEventButtons.forEach((button) => {
      button.addEventListener("click", () => createEventLayer(button.dataset.createEvent || "rotation"));
    });
    $("[data-refresh]").addEventListener("click", () => {
      loadEvents();
      loadContentDashboards();
      showToast("대시보드를 새로고침했습니다.");
    });
    document.querySelectorAll("[data-dashboard-refresh]").forEach((button) => {
      button.addEventListener("click", () => {
        const panelName = button.closest("[data-admin-panel]")?.dataset.adminPanel || "";
        loadContentDashboards(panelName);
        showToast("대시보드 데이터를 새로고침했습니다.");
      });
    });
    document.querySelectorAll("[data-dashboard-create]").forEach((button) => {
      button.addEventListener("click", () => {
        const name = button.dataset.dashboardCreate;
        resetDashboardForm(name);
        showDashboardForm(name);
        dashboardForm(name)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    document.querySelectorAll("[data-dashboard-maker]").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        saveDashboardPost(form);
      });
    });
    document.querySelectorAll("[data-dashboard-cancel]").forEach((button) => {
      button.addEventListener("click", () => {
        const form = button.closest("[data-dashboard-maker]");
        if (form) resetDashboardForm(form.dataset.dashboardMaker);
      });
    });
    document.querySelectorAll("[data-dashboard-list]").forEach((list) => {
      list.addEventListener("click", (event) => {
        const boardToggle = event.target.closest("[data-dashboard-board-toggle]");
        if (boardToggle) {
          const card = boardToggle.closest("[data-dashboard-board-card]");
          if (!card) return;
          const open = card.classList.toggle("is-open");
          boardToggle.setAttribute("aria-expanded", String(open));
          if (open) {
            markDashboardBoardChecked(boardToggle.dataset.dashboardBoardToggle, card);
            loadDashboardBoardDetail(boardToggle.dataset.dashboardBoardToggle, card);
          }
          return;
        }
        const boardReplyEdit = event.target.closest("[data-dashboard-board-reply-edit]");
        if (boardReplyEdit) {
          const card = boardReplyEdit.closest("[data-dashboard-board-card]");
          const box = card?.querySelector("[data-dashboard-board-reply-box]");
          const textarea = box?.querySelector("textarea");
          const message = card?.querySelector("[data-dashboard-board-reply-message]");
          const source = boardReplyEdit.closest(".dashboard-board-message")?.querySelector(".dashboard-board-message-text");
          const replyIndex = String(boardReplyEdit.dataset.dashboardBoardReplyEdit || "").trim();
          if (box) box.dataset.replyIndex = replyIndex;
          if (textarea) {
            textarea.value = source?.textContent || "";
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
          }
          if (message) message.textContent = `관리자 답변 ${Number(replyIndex) + 1 || ""} 수정 중입니다.`.trim();
          return;
        }
        const boardReplySave = event.target.closest("[data-dashboard-board-reply-save]");
        if (boardReplySave) {
          saveDashboardBoardReply(boardReplySave.closest("[data-dashboard-board-card]"));
          return;
        }
        const toggle = event.target.closest("[data-dashboard-toggle]");
        if (toggle) {
          toggleDashboardPost(toggle.dataset.dashboardPanel, toggle.dataset.dashboardToggle);
          return;
        }
        const edit = event.target.closest("[data-dashboard-edit]");
        if (edit) {
          const name = edit.dataset.dashboardPanel;
          const item = (dashboardData[name] || []).find((entry) => dashboardItemId(entry) === edit.dataset.dashboardEdit);
          if (item) {
            fillDashboardForm(name, item, edit.closest("[data-dashboard-item]"));
          }
          return;
        }
        const remove = event.target.closest("[data-dashboard-delete]");
        if (remove) deleteDashboardPost(remove.dataset.dashboardPanel, remove.dataset.dashboardDelete);
      });
    });
    document.querySelectorAll('[data-dashboard-maker] input[type="file"][name="imageFile"]').forEach((input) => {
      input.addEventListener("change", () => handleDashboardImageFile(input));
    });
    $("[data-all-on]").addEventListener("click", async () => {
      const targetEvents = eventsForLayer("rotation");
      targetEvents.forEach((event) => { event.active = true; });
      render();
      try {
        await saveEventsSequentially(targetEvents);
        await loadEvents();
        showToast("전체 선택창을 노출 ON으로 저장했습니다.");
      } catch (error) {
        showToast(`저장 실패: ${error.message}`);
      }
    });
    $("[data-all-off]").addEventListener("click", async () => {
      const targetEvents = eventsForLayer("rotation");
      targetEvents.forEach((event) => { event.active = false; });
      render();
      try {
        await saveEventsSequentially(targetEvents);
        await loadEvents();
        showToast("전체 선택창을 비노출 OFF로 저장했습니다.");
      } catch (error) {
        showToast(`저장 실패: ${error.message}`);
      }
    });
    $("[data-party-all-on]")?.addEventListener("click", async () => {
      const targetEvents = eventsForLayer("party");
      targetEvents.forEach((event) => { event.active = true; });
      render();
      try {
        await saveEventsSequentially(targetEvents);
        await loadEvents();
        showToast("선택창 관리2 전체 레이어를 노출 ON으로 저장했습니다.");
      } catch (error) {
        showToast(`저장 실패: ${error.message}`);
      }
    });
    $("[data-party-all-off]")?.addEventListener("click", async () => {
      const targetEvents = eventsForLayer("party");
      targetEvents.forEach((event) => { event.active = false; });
      render();
      try {
        await saveEventsSequentially(targetEvents);
        await loadEvents();
        showToast("선택창 관리2 전체 레이어를 비노출 OFF로 저장했습니다.");
      } catch (error) {
        showToast(`저장 실패: ${error.message}`);
      }
    });
    function setAdminPanel(name) {
      const panelNames = ["schedule", "events", "events2", "clover", "field", "match", "counsel", "application", "board"];
      const panelName = panelNames.includes(name) ? name : "schedule";
      document.querySelectorAll("[data-admin-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.adminPanel !== panelName;
      });
      document.querySelectorAll("[data-nav]").forEach((item) => {
        item.classList.toggle("is-active", item.dataset.nav === panelName);
      });
      document.querySelectorAll("[data-nav-group]").forEach((group) => {
        group.classList.toggle("is-open", group.dataset.navGroup === panelName);
      });
      try { localStorage.setItem(ADMIN_ACTIVE_PANEL_KEY, panelName); } catch {}
      Object.keys(dashboardPanelCategories).forEach((name) => {
        if (name !== panelName) resetDashboardForm(name);
      });
      if (panelName === "schedule") renderScheduleAdmin();
      else if (panelName === "events" || panelName === "events2") render();
      else loadContentDashboards(panelName);
    }

    function readAdminActivePanel() {
      try {
        const saved = localStorage.getItem(ADMIN_ACTIVE_PANEL_KEY);
        return ["schedule", "events", "events2", "clover", "field", "match", "counsel", "application", "board"].includes(saved) ? saved : "schedule";
      } catch {
        return "schedule";
      }
    }

    document.querySelectorAll("[data-nav]").forEach((button) => {
      button.addEventListener("click", () => {
        const label = button.childNodes[0]?.textContent?.trim() || "메뉴";
        setAdminPanel(button.dataset.nav);
        showToast(`${label} 화면입니다.`);
      });
    });

    scheduleMaker?.addEventListener("submit", (event) => {
      event.preventDefault();
      createScheduleLayers(scheduleMaker);
    });

    scheduleDateCalendar?.addEventListener("click", (event) => {
      const navButton = event.target.closest("[data-schedule-date-nav]");
      if (navButton) {
        const offset = Number(navButton.dataset.scheduleDateNav) || 0;
        const next = new Date(scheduleCalendarYear, scheduleCalendarMonth - 1 + offset, 1);
        scheduleCalendarYear = next.getFullYear();
        scheduleCalendarMonth = next.getMonth() + 1;
        renderScheduleDateCalendar();
        return;
      }
      const dateButton = event.target.closest("[data-schedule-date]");
      if (dateButton) setScheduleDateValue(dateButton.dataset.scheduleDate);
    });

    scheduleLayerList?.addEventListener("click", async (event) => {
      const deleteButton = event.target.closest("[data-schedule-delete]");
      if (!deleteButton) {
        const card = event.target.closest("[data-admin-schedule-id]");
        if (!card) return;
        const post = dashboardSchedulePosts().find((item) => String(item.id) === card.dataset.adminScheduleId);
        if (!post) return;
        fillScheduleMaker(post);
        showToast("일정 안내 레이어를 수정 모드로 불러왔습니다.");
        return;
      }
      const id = deleteButton.dataset.scheduleDelete;
      const targetPost = dashboardSchedulePosts().find((item) => String(item.id) === id);
      if (targetPost?.source === "기본" || id.startsWith("placeholder-")) {
        const deletedSlots = readDeletedScheduleSlots();
        if (targetPost?.scheduleDate && targetPost?.scheduleTime) deletedSlots.add(scheduleSlotKey(targetPost));
        writeDeletedScheduleSlots(deletedSlots);
        renderScheduleAdmin();
        showToast("기본 슬롯을 목록에서 숨겼습니다.");
        return;
      }
      try {
        await apiPost({ type: "schedulePostDelete", id });
        adminSchedulePosts = adminSchedulePosts.filter((post) => String(post.id) !== id);
        if (editingScheduleId === id) resetScheduleMaker();
        renderScheduleAdmin();
        showToast("일정 안내 레이어를 삭제했습니다.");
      } catch (error) {
        showToast(`삭제 실패: ${error.message}`);
      }
    });
    async function handleEventFormSubmit(event) {
      const formEl = event.target.closest("[data-edit-form]");
      if (!formEl) return;
      event.preventDefault();
      const item = events.find((entry) => entry.id === formEl.dataset.editId);
      if (!item) return;
      const form = new FormData(formEl);
      const snapshot = { ...item };
      item.title = String(form.get("title") || item.title).trim() || item.title;
      item.layerType = form.get("layerType") === "party" ? "party" : "rotation";
      item.station = String(form.get("station") || "").trim() || (item.layerType === "party" ? "모임" : "신규");
      item.target = String(form.get("target") || item.target).trim() || item.target;
      item.date = String(form.get("date") || "").trim() || "상시 모집";
      item.place = String(form.get("place") || "").trim() || "부산 클로버 라운지 (승인 후 안내)";
      item.male = String(form.get("male") || "").trim() || "6";
      item.female = String(form.get("female") || "").trim() || "6";
      item.capacity = String(form.get("capacity") || "").trim() || "12명";
      item.malePrice = String(form.get("malePrice") || "").trim() || "50,000원";
      item.femalePrice = String(form.get("femalePrice") || "").trim() || "30,000원";
      item.price = item.malePrice;
      item.image = String(form.get("image") || item.image || "").trim();
      item.imageUrl = adminImageUrl(item.image);
      item.badgeType = String(form.get("badgeType") || "").trim();
      item.active = form.get("active") !== "false";
      writeEdits({
        ...readEdits(),
        [item.id]: eventStorageData(item)
      });
      editingEventId = "";
      render();
      try {
        await apiPost(eventSavePayload(item));
        showToast(`${item.title} 전체 수정 저장됨`);
      } catch (error) {
        Object.assign(item, snapshot);
        render();
        showToast(`저장 실패: ${error.message}`);
      }
    }

    listEl.addEventListener("submit", handleEventFormSubmit);
    partyListEl?.addEventListener("submit", handleEventFormSubmit);

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && editingEventId) closeEditModal();
    });

    window.addEventListener("storage", (event) => {
      if (event.key === EVENT_ORDER_OVERRIDE_KEY) {
        events.splice(0, events.length, ...applySavedOrder(events));
        render();
        return;
      }
      if (event.key === EVENT_CUSTOM_OVERRIDE_KEY || event.key === EVENT_EDIT_OVERRIDE_KEY || event.key === EVENT_DELETED_OVERRIDE_KEY) {
        events.splice(0, events.length, ...applySavedOrder(managedEvents()));
        render();
        return;
      }
      if (event.key === EVENT_ACTIVE_OVERRIDE_KEY) render();
      if (event.key === ADMIN_SCHEDULE_POSTS_KEY || event.key === ADMIN_SCHEDULE_BACKUP_KEY || event.key === ADMIN_SCHEDULE_DELETED_KEY) renderScheduleAdmin();
    });

    const initialAdminPanel = readAdminActivePanel();
    initScheduleMaker();
    setAdminPanel(initialAdminPanel);
    renderScheduleAdmin();
    loadEvents();
    loadAdminSchedulePosts();
    if (!["clover", "field", "match", "counsel", "application", "board"].includes(initialAdminPanel)) {
      loadContentDashboards();
    }
  </script>
</body>
</html>
