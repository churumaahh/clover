<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLOVER 관리자 모드</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <script src="../../config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --accent: #00ff40;
      --accent-soft: rgba(0, 255, 64, .16);
      --bg: #101010;
      --panel: #1f1f1f;
      --panel-2: #242424;
      --ink: #f7f9fb;
      --muted: #b8c0ca;
      --line: #303030;
      --shadow: 8px 10px 24px rgba(0,0,0,.35), -4px -4px 12px rgba(255,255,255,.03);
      --inset: inset 4px 4px 10px rgba(0,0,0,.45), inset -3px -3px 8px rgba(255,255,255,.04);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
    }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    .remote-top {
      display: grid;
      gap: 12px;
      padding-bottom: 4px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 3px 0 5px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: linear-gradient(145deg, #262626, #151515 68%);
      border: 1px solid rgba(255,255,255,.04);
      box-shadow: inset 5px 5px 11px rgba(0,0,0,.58), inset -4px -4px 9px rgba(255,255,255,.055), 6px 8px 16px rgba(0,0,0,.32);
    }
    .brand-mark img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 1px 0 rgba(255,255,255,.18)) drop-shadow(0 5px 9px rgba(0,0,0,.58));
      opacity: .98;
    }
    .brand-copy { min-width: 0; flex: 1 1 auto; }
    .brand strong {
      display: block;
      color: #f7f9fb;
      font-size: 21px;
      line-height: .95;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255,255,255,.14), 0 7px 14px rgba(0,0,0,.5);
    }
    .brand span {
      display: block;
      margin-top: 5px;
      color: #d8dde3;
      font-size: 11px;
      line-height: 1.1;
      font-weight: 900;
      text-shadow: 0 1px 0 rgba(255,255,255,.1), 0 5px 10px rgba(0,0,0,.45);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid #343434;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }
    .icon-btn:active {
      transform: translateY(1px);
      box-shadow: var(--inset);
    }
    .link-btn, .soft-btn, .toggle-btn, .nav-btn {
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--ink);
      box-shadow: var(--shadow);
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .link-btn:active, .soft-btn:active, .toggle-btn:active, .nav-btn:active {
      transform: translateY(1px);
      box-shadow: var(--inset);
    }
    .layout {
      width: min(1320px, calc(100% - 28px));
      margin: 14px auto 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(286px, 340px);
      gap: 16px;
      align-items: start;
    }
    main { min-width: 0; }
    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .remote-nav { display: grid; gap: 10px; }
    .nav-btn {
      justify-content: space-between;
      width: 100%;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.04), 4px 5px 12px rgba(0, 0, 0, .28);
    }
    .nav-btn.is-active { outline: 2px solid var(--accent); background: #1f2b22; color: #fff; }
    .nav-group {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .nav-submenu {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid #303030;
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 4px 4px 10px rgba(0,0,0,.36), inset -2px -2px 7px rgba(255,255,255,.035);
    }
    .nav-submenu .page-head { gap: 4px; }
    .nav-submenu h1 { font-size: 18px; }
    .nav-submenu .sub { font-size: 11px; }
    .nav-submenu .metric {
      border-radius: 12px;
      background: #202020;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.035), 3px 4px 10px rgba(0,0,0,.22);
    }
    .nav-submenu .metric strong { font-size: 24px; }
    .count-pill {
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      background: #050805;
      color: #fff;
      font-size: 12px;
    }
    .page-head {
      display: grid;
      gap: 7px;
      margin: 0;
    }
    h1 { margin: 0; font-size: 26px; line-height: 1.05; }
    .sub { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
    }
    .metric, .panel, .event-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .metric { min-width: 0; padding: 12px 10px; }
    .metric span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 8px; white-space: nowrap; }
    .metric strong { font-size: 28px; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0;
    }
    .toolbar .search { grid-column: 1 / -1; }
    .search {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 16px;
      outline: 0;
      box-shadow: inset 2px 2px 6px rgba(0, 0, 0, .28);
    }
    .panel { padding: 14px; }
    .event-list { display: grid; gap: 12px; }
    .create-layer-wrap {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .create-btn {
      width: 100%;
      min-height: 54px;
      border-radius: 14px;
      background: var(--accent);
      color: #061008;
      font-size: 17px;
      font-weight: 950;
      box-shadow: 5px 7px 16px rgba(0, 255, 64, .22), inset -2px -2px 6px rgba(0,0,0,.16), inset 2px 2px 6px rgba(255,255,255,.28);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .create-btn:active {
      transform: translateY(1px);
      box-shadow: inset 4px 4px 10px rgba(0,0,0,.18), inset -3px -3px 8px rgba(255,255,255,.22);
    }
    .event-list.is-reordering { cursor: grabbing; }
    .event-list.is-reordering .event-card:not(.is-dragging) { cursor: grabbing; }
    .event-card {
      position: relative;
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr) 154px;
      gap: 14px;
      padding: 12px;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      cursor: grab;
      transition: border-color .16s ease, box-shadow .16s ease, opacity .16s ease, transform .16s ease, background .16s ease;
    }
    .event-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(0, 255, 64, .08), rgba(0, 255, 64, 1));
      box-shadow: 0 0 18px rgba(0, 255, 64, .75);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
      pointer-events: none;
    }
    .event-card::after {
      content: "";
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 3;
      min-width: 58px;
      padding: 6px 10px;
      border: 1px solid rgba(0, 255, 64, .45);
      border-radius: 999px;
      background: rgba(6, 16, 8, .9);
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .34), 0 0 16px rgba(0, 255, 64, .28);
      opacity: 0;
      transform: translateY(-4px) scale(.96);
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .event-card.is-off { opacity: .58; }
    .event-card.is-pressing {
      border-color: rgba(0, 255, 64, .48);
      box-shadow: 0 0 0 2px rgba(0, 255, 64, .12), 0 14px 26px rgba(0, 0, 0, .3);
      transform: scale(.997);
      cursor: grabbing;
    }
    .event-card.is-pressing::before {
      opacity: 1;
      animation: hold-progress .52s linear forwards;
    }
    .event-card.is-dragging {
      border-color: rgba(0, 255, 64, .95);
      background: #20251f;
      box-shadow: 0 0 0 3px rgba(0, 255, 64, .26), 0 24px 46px rgba(0, 0, 0, .48), 0 0 30px rgba(0, 255, 64, .16);
      transform: translateY(-4px) scale(1.012);
      opacity: .94;
      cursor: grabbing;
      z-index: 5;
    }
    .event-card.is-dragging::before {
      opacity: 1;
      transform: scaleX(1);
      animation: none;
    }
    .event-card.is-dragging::after {
      content: "이동 중";
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .event-card.is-dragging .thumb {
      box-shadow: inset 0 0 0 2px rgba(0, 255, 64, .52);
      filter: saturate(1.15) brightness(1.08);
    }
    @keyframes hold-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #252a31;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .meta { min-width: 0; }
    .station {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #62f28f;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .station::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0,255,64,.7);
    }
    .title { font-size: 18px; line-height: 1.22; margin-bottom: 7px; word-break: keep-all; }
    .desc { color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.45; }
    .mini { margin-top: 7px; color: #62f28f; font-size: 12px; line-height: 1.4; }
    .event-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; justify-items: stretch; }
    .toggle-btn {
      min-height: 48px;
      border-radius: 10px;
      padding: 0;
      font-size: 15px;
    }
    .toggle-btn.is-on { background: var(--accent); color: #061008; box-shadow: 5px 7px 16px rgba(0, 255, 64, .22), -4px -4px 10px rgba(255,255,255,.03); }
    .toggle-btn.is-off { color: #9aa4b2; background: #252525; border: 1px solid #343434; }
    .event-actions .toggle-btn,
    .event-actions .small-btn {
      min-height: 40px;
      border-radius: 9px;
      padding: 0;
      font-size: 14px;
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24);
    }
    .event-actions .toggle-btn.is-on {
      background: #242424;
      border: 1px solid #343434;
      color: var(--accent);
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24), inset 0 0 0 1px rgba(0, 255, 64, .08);
    }
    .event-actions .toggle-btn.is-off {
      color: #9aa4b2;
      background: #242424;
      border: 1px solid #343434;
    }
    .small-btn {
      min-height: 36px;
      border-radius: 9px;
      background: #242424;
      border: 1px solid #343434;
      color: #fff;
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24);
    }
    .danger-btn {
      color: #ff7b7b;
      border-color: rgba(255, 96, 96, .42);
      background: #241818;
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24), inset 0 0 0 1px rgba(255, 96, 96, .06);
    }
    .empty {
      display: none;
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
    }
    .empty.is-visible { display: block; }
    .toast {
      position: fixed;
      left: 50%;
      top: max(14px, env(safe-area-inset-top));
      bottom: auto;
      z-index: 100;
      min-width: min(360px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      padding: 13px 16px;
      border: 1px solid rgba(0, 255, 64, .35);
      border-radius: 12px;
      background: #181f1a;
      color: var(--ink);
      box-shadow: 0 16px 30px rgba(0, 0, 0, .38);
      text-align: center;
      transform: translate(-50%, -16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }
    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .edit-layer {
      margin-top: -2px;
      border: 1px solid rgba(0, 255, 64, .28);
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 16px 32px rgba(0,0,0,.28);
    }
    .edit-form { display: grid; gap: 14px; padding: 16px; }
    .edit-head, .edit-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .edit-head h2 { margin: 0; font-size: 18px; }
    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .edit-field { display: grid; gap: 7px; min-width: 0; color: var(--muted); font-size: 12px; }
    .edit-field.is-wide { grid-column: 1 / -1; }
    .edit-field input, .edit-field textarea, .edit-field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #121212;
      color: var(--ink);
      padding: 10px 12px;
      outline: 0;
      font: inherit;
    }
    .edit-field textarea { min-height: 82px; resize: vertical; }
    .edit-actions { justify-content: flex-end; }
    @media (max-width: 620px) {
      .edit-grid { grid-template-columns: 1fr; }
    }
    .link-btn, .soft-btn, .nav-btn, .small-btn { border-color: #343434; }
    .search { background: #1f1f1f; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; grid-row: 1; max-height: none; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .event-card { grid-template-columns: 120px minmax(0, 1fr); }
      .event-actions { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar .search { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <main>
      <section class="panel">
        <div class="event-list" data-list></div>
        <div class="empty" data-empty>검색 결과가 없습니다.</div>
        <div class="create-layer-wrap">
          <button class="create-btn" type="button" data-create-event>생성</button>
        </div>
      </section>
    </main>

    <aside class="side remote-control" aria-label="관리자 리모콘">
      <section class="remote-top" aria-label="관리자 상단 리모콘">
        <div class="brand" aria-label="CLOVER 로테이션 소개팅">
          <span class="brand-mark" aria-hidden="true"><img src="../../assets/clover-logo-v2.png" alt=""></span>
          <div class="brand-copy">
            <strong>CLOVER</strong>
            <span>로테이션 소개팅</span>
          </div>
          <button class="icon-btn" type="button" data-refresh aria-label="새로고침" title="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
        </div>
      </section>

      <nav class="remote-nav" aria-label="관리자 메뉴">
        <button class="nav-btn" type="button" data-nav="application">신청 접수 <span class="count-pill">-</span></button>
        <button class="nav-btn" type="button" data-nav="board">게시판 접수 <span class="count-pill">-</span></button>
        <button class="nav-btn" type="button" data-nav="hero">히어로 관리 <span class="count-pill">-</span></button>
        <div class="nav-group is-open" data-nav-group="events">
          <button class="nav-btn is-active" type="button" data-nav="events">선택창 관리 <span class="count-pill" data-menu-count>0</span></button>
          <div class="nav-submenu" aria-label="선택창 관리 하위 메뉴">
            <section class="cards" aria-label="선택창 요약">
              <article class="metric"><span>전체 선택창</span><strong data-total>0</strong></article>
              <article class="metric"><span>노출 ON</span><strong data-on>0</strong></article>
              <article class="metric"><span>비노출 OFF</span><strong data-off>0</strong></article>
            </section>

            <section class="toolbar">
              <input class="search" type="search" placeholder="이름, 분류, 대상 검색" data-search>
              <button class="soft-btn" type="button" data-all-on>전체 ON</button>
              <button class="soft-btn" type="button" data-all-off>전체 OFF</button>
            </section>
          </div>
        </div>
        <button class="nav-btn" type="button" data-nav="schedule">일정 관리 <span class="count-pill">-</span></button>
      </nav>
    </aside>
  </div>
  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <script>
    const EVENT_ACTIVE_OVERRIDE_KEY = "cloverAdminEventActiveOverrides:v1";
    const EVENT_EDIT_OVERRIDE_KEY = "cloverAdminEventEdits:v1";
    const EVENT_ORDER_OVERRIDE_KEY = "cloverAdminEventOrder:v1";
    const EVENT_CUSTOM_OVERRIDE_KEY = "cloverAdminCustomEvents:v1";
    const EVENT_DELETED_OVERRIDE_KEY = "cloverAdminDeletedEvents:v1";
    const eventCardPresets = Object.freeze([
      { station: "랜덤", title: "순차적으로 무작위 선정", target: "우연처럼 시작되는 설렘", image: "assets/event-random-destiny-new.png" },
      { station: "취향", title: "운동을 좋아하는 사람", target: "같이 땀 흘리고 건강하게 가까워지는 만남", image: "assets/event-taste-workout.png" },
      { station: "취향", title: "활동적인 데이트 선호", target: "새로운 경험을 좋아하는 에너지 있는 만남", image: "assets/event-taste-active.png" },
      { station: "취향", title: "국내·외 여행을 즐기는 사람", target: "낯선 길과 작은 순간을 함께 즐기는 만남", image: "assets/event-taste-travel.png" },
      { station: "취향", title: "집에서 보내는 걸 선호", target: "편안한 공간에서 천천히 가까워지는 만남", image: "assets/event-taste-homebody.png" },
      { station: "라이브", title: "9 to 6 직장인", target: "퇴근 후 일상에 설렘을 더하는 만남", image: "assets/event-live-office-worker-new.png" },
      { station: "라이브", title: "교대 근무자를 하는 사람", target: "서로의 리듬을 이해하는 현실적인 만남", image: "assets/event-live-shift-worker.png" },
      { station: "라이브", title: "기독교 종교를 가진 사람", target: "가치관과 따뜻한 대화가 통하는 만남", image: "assets/event-live-christian.png" },

      { station: "테마", title: "호감형 외모를 가진 사람", target: "첫인상부터 편안한 분위기의 만남", image: "assets/event-theme-warm.png" },

      { station: "테마", title: "한국어 가능한 일본인 여성 선호", target: "다른 문화의 매력을 자연스럽게 만나는 시간", image: "assets/event-theme-japanese-woman.png" },
      { station: "테마", title: "180cm 이상 남성 선호", target: "든든한 분위기를 선호하는 분들을 위한 만남", image: "assets/event-theme-tall-man.png" },
      { station: "테마", title: "전문직 남성 선호", target: "전문성과 안정감을 갖춘 대화 중심의 만남", image: "assets/event-theme-professional-man.png" },
      { station: "테마", title: "공무원 여성 선호", target: "단정하고 안정적인 일상을 함께 나누는 만남", image: "assets/event-theme-public-servant-woman.png" },
      { station: "테마", title: "연봉 7천 이상 남성 선호", target: "일과 삶을 균형 있게 바라보는 만남", image: "assets/event-theme-career-man.png" },
      { station: "테마", title: "자산 5억 이상 남성 선호", target: "여유와 책임감을 중요하게 보는 만남", image: "assets/event-theme-wealthy-man.png" },
      { station: "테마", title: "이혼 경험이 있는 남·여", target: "조금 더 성숙하고 솔직한 두 번째 설렘", image: "assets/event-theme-divorced.png" },
      { station: "모임", title: "함께 공부하는 모임", target: "가벼운 스터디로 자연스럽게 가까워지는 모임", image: "assets/event-group-study-cafe.png" }
    ]);

    const $ = (selector) => document.querySelector(selector);
    const listEl = $("[data-list]");
    const searchEl = $("[data-search]");
    const createEventBtn = $("[data-create-event]");
    const toastEl = $("[data-toast]");
    let toastTimer = 0;
    let editingEventId = "";
    let fallbackOverrides = {};
    let fallbackEdits = {};
    let fallbackCustomEvents = [];
    let fallbackDeletedEvents = [];
    let fallbackOrder = [];
    let pressTimer = 0;
    let pressingCardEl = null;
    let draggingEventId = "";
    let didReorderDrag = false;

    function eventPresetId(index) {
      return `clover-default-event-${String(index + 1).padStart(2, "0")}`;
    }

    function readOverrides() {
      try {
        fallbackOverrides = JSON.parse(localStorage.getItem(EVENT_ACTIVE_OVERRIDE_KEY) || "{}");
        return fallbackOverrides;
      } catch {
        return fallbackOverrides;
      }
    }

    function writeOverrides(overrides) {
      fallbackOverrides = { ...overrides };
      try { localStorage.setItem(EVENT_ACTIVE_OVERRIDE_KEY, JSON.stringify(fallbackOverrides)); } catch {}
    }

    function readEdits() {
      try {
        fallbackEdits = JSON.parse(localStorage.getItem(EVENT_EDIT_OVERRIDE_KEY) || "{}");
        return fallbackEdits;
      } catch {
        return fallbackEdits;
      }
    }

    function writeEdits(edits) {
      fallbackEdits = { ...edits };
      try { localStorage.setItem(EVENT_EDIT_OVERRIDE_KEY, JSON.stringify(fallbackEdits)); } catch {}
    }

    function readCustomEvents() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EVENT_CUSTOM_OVERRIDE_KEY) || "[]");
        fallbackCustomEvents = Array.isArray(parsed) ? parsed.filter((item) => item && typeof item === "object") : fallbackCustomEvents;
        return fallbackCustomEvents;
      } catch {
        return fallbackCustomEvents;
      }
    }

    function writeCustomEvents(customEvents) {
      fallbackCustomEvents = Array.isArray(customEvents) ? [...customEvents] : [];
      try { localStorage.setItem(EVENT_CUSTOM_OVERRIDE_KEY, JSON.stringify(fallbackCustomEvents)); } catch {}
    }

    function readOrder() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EVENT_ORDER_OVERRIDE_KEY) || "[]");
        fallbackOrder = Array.isArray(parsed) ? parsed : fallbackOrder;
        return fallbackOrder;
      } catch {
        return fallbackOrder;
      }
    }

    function writeOrder(order) {
      fallbackOrder = Array.isArray(order) ? [...order] : [];
      try { localStorage.setItem(EVENT_ORDER_OVERRIDE_KEY, JSON.stringify(fallbackOrder)); } catch {}
    }

    function readDeletedEvents() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EVENT_DELETED_OVERRIDE_KEY) || "[]");
        fallbackDeletedEvents = Array.isArray(parsed) ? parsed.map(String) : fallbackDeletedEvents;
        return fallbackDeletedEvents;
      } catch {
        return fallbackDeletedEvents;
      }
    }

    function writeDeletedEvents(ids) {
      fallbackDeletedEvents = Array.isArray(ids) ? [...new Set(ids.map(String))] : [];
      try { localStorage.setItem(EVENT_DELETED_OVERRIDE_KEY, JSON.stringify(fallbackDeletedEvents)); } catch {}
    }

    function applySavedOrder(list) {
      const savedOrder = readOrder();
      if (!savedOrder.length) return list;
      const rank = new Map(savedOrder.map((id, index) => [id, index]));
      return [...list].sort((a, b) => {
        const aRank = rank.has(a.id) ? rank.get(a.id) : Number.MAX_SAFE_INTEGER + a.order;
        const bRank = rank.has(b.id) ? rank.get(b.id) : Number.MAX_SAFE_INTEGER + b.order;
        return aRank - bRank;
      });
    }

    function updateEventOrders() {
      events.forEach((event, index) => {
        event.order = index + 1;
      });
    }

    function persistEventOrder() {
      updateEventOrders();
      writeOrder(events.map((event) => event.id));
    }

    function isCustomEvent(event) {
      return String(event?.id || "").startsWith("clover-custom-event-");
    }

    function eventStorageData(event) {
      return {
        id: event.id,
        order: event.order,
        station: event.station,
        title: event.title,
        target: event.target,
        date: event.date,
        place: event.place,
        male: event.male,
        female: event.female,
        capacity: event.capacity,
        price: event.price,
        image: event.image,
        imageUrl: event.imageUrl,
        active: isActive(event)
      };
    }

    function persistCustomEvents() {
      updateEventOrders();
      writeCustomEvents(events.filter(isCustomEvent).map(eventStorageData));
    }

    function moveEventTo(dragId, targetId, afterTarget = false) {
      if (!dragId || !targetId || dragId === targetId) return false;
      const before = events.map((event) => event.id).join("|");
      const from = events.findIndex((event) => event.id === dragId);
      if (from < 0) return false;
      const [moved] = events.splice(from, 1);
      const targetIndex = events.findIndex((event) => event.id === targetId);
      if (targetIndex < 0) {
        events.splice(from, 0, moved);
        return false;
      }
      events.splice(targetIndex + (afterTarget ? 1 : 0), 0, moved);
      if (events.map((event) => event.id).join("|") === before) return false;
      persistEventOrder();
      return true;
    }

    function isInteractiveReorderTarget(target) {
      return Boolean(target.closest("button, a, input, textarea, select, label, [data-edit-layer]"));
    }

    function clearPressFeedback() {
      pressingCardEl?.classList.remove("is-pressing");
      pressingCardEl = null;
    }

    function clearPressTimer() {
      if (pressTimer) window.clearTimeout(pressTimer);
      pressTimer = 0;
      clearPressFeedback();
    }

    function startReorder(eventId) {
      if (!events.some((event) => event.id === eventId)) return;
      clearPressTimer();
      draggingEventId = eventId;
      didReorderDrag = false;
      listEl.classList.add("is-reordering");
      render();
      showToast("길게 누른 상태로 이동해 순서를 바꾸세요.");
    }

    function finishReorder() {
      clearPressTimer();
      if (!draggingEventId) return;
      const shouldToast = didReorderDrag;
      draggingEventId = "";
      didReorderDrag = false;
      listEl.classList.remove("is-reordering");
      render();
      if (shouldToast) showToast("레이어 순서 저장됨");
    }

    function showToast(message) {
      if (!toastEl) return;
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toastEl.classList.remove("is-visible"), 1800);
    }

    function eventKey(event) {
      return `${event.station}::${event.title}`;
    }

    function optimizedAssetPath(raw) {
      const match = raw.match(/^assets\/([^?#\/]+)\.(png|jpe?g)([?#].*)?$/i);
      if (!match) return raw;
      const name = match[1];
      if (/^(favicon|clover-logo)/i.test(name)) return raw;
      return `assets/optimized/${name}.webp${match[3] || ""}`;
    }

    function adminImageUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (/^(https?:)?\/\//i.test(raw)) return raw;
      if (raw.startsWith("../../")) return raw;
      const optimized = optimizedAssetPath(raw.replace(/^\/+/, ""));
      return `../../${optimized}`;
    }

    function createEvent(preset, index) {
      const image = preset.image || preset.imageUrl || "";
      return {
        ...preset,
        id: preset.id || eventPresetId(index),
        order: Number(preset.order) || index + 1,
        date: preset.date || "상시 모집",
        place: preset.place || "부산 클로버 라운지 (승인 후 안내)",
        male: preset.male || "6",
        female: preset.female || "6",
        capacity: preset.capacity || "12명",
        price: preset.price || "50,000원",
        image,
        imageUrl: adminImageUrl(image)
      };
    }

    function applySavedEdit(event) {
      const edit = readEdits()[event.id];
      if (!edit) return event;
      const merged = { ...event, ...edit };
      merged.imageUrl = adminImageUrl(merged.image);
      return merged;
    }

    function managedEvents() {
      const deleted = new Set(readDeletedEvents());
      const defaults = eventCardPresets.map((preset, index) => applySavedEdit(createEvent(preset, index)));
      const custom = readCustomEvents().map((preset, index) => applySavedEdit(createEvent(preset, eventCardPresets.length + index)));
      return [...defaults, ...custom].filter((event) => !deleted.has(event.id));
    }

    function newCustomEventId() {
      let id = `clover-custom-event-${Date.now()}`;
      while (events.some((event) => event.id === id)) id = `clover-custom-event-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      return id;
    }

    function createBlankEvent() {
      return createEvent({
        id: newCustomEventId(),
        station: "신규",
        title: "새 선택창",
        target: "대상 설명을 입력하세요",
        image: "assets/event-theme-warm.png"
      }, events.length);
    }

    function createEventLayer() {
      const item = createBlankEvent();
      events.push(item);
      const deleted = readDeletedEvents().filter((id) => id !== item.id);
      writeDeletedEvents(deleted);
      const overrides = readOverrides();
      overrides[item.id] = true;
      overrides[eventKey(item)] = true;
      writeOverrides(overrides);
      persistEventOrder();
      persistCustomEvents();
      if (searchEl.value) searchEl.value = "";
      openEditModal(item);
      showToast("새 레이어를 맨 아래에 생성했습니다.");
    }

    function deleteEventLayer(item) {
      if (!item) return;
      const ok = window.confirm(`'${item.title}' 레이어를 삭제할까요? 삭제하면 대시보드와 사이트에서 사라집니다.`);
      if (!ok) return;
      const index = events.findIndex((event) => event.id === item.id);
      if (index < 0) return;
      events.splice(index, 1);
      if (editingEventId === item.id) editingEventId = "";

      const deleted = readDeletedEvents();
      if (!deleted.includes(item.id)) deleted.push(item.id);
      writeDeletedEvents(deleted);

      const edits = readEdits();
      delete edits[item.id];
      writeEdits(edits);

      const overrides = readOverrides();
      delete overrides[item.id];
      delete overrides[eventKey(item)];
      writeOverrides(overrides);

      persistEventOrder();
      persistCustomEvents();
      render();
      showToast(`${item.title} 레이어를 삭제했습니다.`);
    }

    const events = applySavedOrder(managedEvents());
    updateEventOrders();

    function isActive(event) {
      const overrides = readOverrides();
      if (typeof overrides[event.id] === "boolean") return overrides[event.id];
      if (typeof overrides[eventKey(event)] === "boolean") return overrides[eventKey(event)];
      return true;
    }

    function setActive(event, active) {
      const overrides = readOverrides();
      overrides[event.id] = active;
      overrides[eventKey(event)] = active;
      writeOverrides(overrides);
      render();
      showToast(`${event.title} ${active ? "노출 ON" : "비노출 OFF"} 저장됨`);
    }

    function renderMetrics(filtered) {
      const activeCount = events.filter(isActive).length;
      $("[data-total]").textContent = events.length;
      $("[data-on]").textContent = activeCount;
      $("[data-off]").textContent = events.length - activeCount;
      $("[data-menu-count]").textContent = events.length;
      $("[data-empty]").classList.toggle("is-visible", filtered.length === 0);
    }

    function htmlAttr(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function editFormMarkup(item) {
      const active = isActive(item);
      const image = item.image || String(item.imageUrl || "").replace(/^\.\.\/\.\.\//, "");
      return `
        <section class="edit-layer" data-edit-layer="${htmlAttr(item.id)}">
          <form class="edit-form" data-edit-form data-edit-id="${htmlAttr(item.id)}">
            <div class="edit-head">
              <h2>선택창 수정</h2>
              <button class="small-btn" type="button" data-edit-close>닫기</button>
            </div>
            <div class="edit-grid">
              <label class="edit-field">분류
                <input name="station" autocomplete="off" value="${htmlAttr(item.station)}">
              </label>
              <label class="edit-field">제목
                <input name="title" autocomplete="off" required value="${htmlAttr(item.title)}">
              </label>
              <label class="edit-field is-wide">대상 설명
                <textarea name="target" required>${htmlAttr(item.target)}</textarea>
              </label>
              <label class="edit-field">일정
                <input name="date" autocomplete="off" value="${htmlAttr(item.date)}">
              </label>
              <label class="edit-field">장소
                <input name="place" autocomplete="off" value="${htmlAttr(item.place)}">
              </label>
              <label class="edit-field">남성 인원
                <input name="male" autocomplete="off" inputmode="numeric" value="${htmlAttr(item.male)}">
              </label>
              <label class="edit-field">여성 인원
                <input name="female" autocomplete="off" inputmode="numeric" value="${htmlAttr(item.female)}">
              </label>
              <label class="edit-field">모집 인원
                <input name="capacity" autocomplete="off" value="${htmlAttr(item.capacity)}">
              </label>
              <label class="edit-field">금액
                <input name="price" autocomplete="off" value="${htmlAttr(item.price)}">
              </label>
              <label class="edit-field is-wide">이미지 경로
                <input name="image" autocomplete="off" value="${htmlAttr(image)}">
              </label>
              <label class="edit-field">노출 상태
                <select name="active">
                  <option value="true"${active ? " selected" : ""}>ON</option>
                  <option value="false"${active ? "" : " selected"}>OFF</option>
                </select>
              </label>
            </div>
            <div class="edit-actions">
              <button class="soft-btn" type="button" data-edit-close>취소</button>
              <button class="toggle-btn is-on" type="submit">저장</button>
            </div>
          </form>
        </section>
      `;
    }

    function openEditModal(item) {
      if (!item) return;
      editingEventId = item.id;
      render();
      window.setTimeout(() => {
        const layer = listEl.querySelector("[data-edit-form]");
        layer?.querySelector('[name="title"]')?.focus();
        layer?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }, 0);
    }

    function closeEditModal() {
      if (!editingEventId) return;
      editingEventId = "";
      render();
    }

    function render() {
      updateEventOrders();
      const q = (searchEl.value || "").trim().toLowerCase();
      const filtered = events.filter((event) => {
        const text = `${event.station} ${event.title} ${event.target} ${event.place}`.toLowerCase();
        return !q || text.includes(q);
      });
      renderMetrics(filtered);
      listEl.innerHTML = filtered.map((event) => {
        const active = isActive(event);
        return `
          <article class="event-card${active ? "" : " is-off"}${draggingEventId === event.id ? " is-dragging" : ""}" data-event-id="${event.id}">
            <div class="thumb">
              <img src="${event.imageUrl}" alt="" loading="lazy">
            </div>
            <div class="meta">
              <div class="station">[${event.station}]</div>
              <div class="title">${event.title}</div>
              <div class="desc">${event.target}</div>
              <div class="mini">순서 ${event.order} · 남 ${event.male} / 여 ${event.female} · ${event.price || ""} · ${active ? "노출 중" : "비활성"}</div>
            </div>
            <div class="event-actions">
              <button class="small-btn danger-btn" type="button" data-delete="${event.id}">삭제</button>
              <button class="toggle-btn ${active ? "is-on" : "is-off"}" type="button" data-toggle="${event.id}">${active ? "ON" : "OFF"}</button>
              <button class="small-btn" type="button" data-up="${event.id}">수정</button>
              <button class="small-btn" type="button" data-preview="${event.id}">보기</button>
            </div>
          </article>
          ${editingEventId === event.id ? editFormMarkup(event) : ""}
        `;
      }).join("");
    }

    listEl.addEventListener("click", (event) => {
      const closeEdit = event.target.closest("[data-edit-close]");
      if (closeEdit) {
        closeEditModal();
        return;
      }
      const deleteButton = event.target.closest("[data-delete]");
      if (deleteButton) {
        const item = events.find((entry) => entry.id === deleteButton.dataset.delete);
        deleteEventLayer(item);
        return;
      }
      const toggle = event.target.closest("[data-toggle]");
      if (toggle) {
        const item = events.find((entry) => entry.id === toggle.dataset.toggle);
        if (item) setActive(item, !isActive(item));
        return;
      }
      const preview = event.target.closest("[data-preview]");
      if (preview) {
        window.open("../../index.html", "_blank", "noopener");
        return;
      }
      const edit = event.target.closest("[data-up]");
      if (edit) {
        const item = events.find((entry) => entry.id === edit.dataset.up);
        openEditModal(item);
        return;
      }
    });

    listEl.addEventListener("pointerdown", (event) => {
      const card = event.target.closest(".event-card[data-event-id]");
      if (!card || isInteractiveReorderTarget(event.target)) return;
      clearPressTimer();
      pressingCardEl = card;
      pressingCardEl.classList.add("is-pressing");
      const startX = event.clientX;
      const startY = event.clientY;
      pressTimer = window.setTimeout(() => startReorder(card.dataset.eventId), 520);

      const cancelIfMoved = (moveEvent) => {
        if (!pressTimer) {
          window.removeEventListener("pointermove", cancelIfMoved);
          return;
        }
        const distance = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
        if (distance > 9) {
          clearPressTimer();
          window.removeEventListener("pointermove", cancelIfMoved);
        }
      };
      window.addEventListener("pointermove", cancelIfMoved, { passive: true });
      window.addEventListener("pointerup", () => window.removeEventListener("pointermove", cancelIfMoved), { once: true });
      window.addEventListener("pointercancel", () => window.removeEventListener("pointermove", cancelIfMoved), { once: true });
    });

    window.addEventListener("pointermove", (event) => {
      if (!draggingEventId) return;
      event.preventDefault();
      const target = document.elementFromPoint(event.clientX, event.clientY);
      const card = target?.closest?.(".event-card[data-event-id]");
      if (!card || card.dataset.eventId === draggingEventId) return;
      const rect = card.getBoundingClientRect();
      const afterTarget = event.clientY > rect.top + rect.height / 2;
      if (moveEventTo(draggingEventId, card.dataset.eventId, afterTarget)) {
        didReorderDrag = true;
        render();
      }
    }, { passive: false });

    window.addEventListener("pointerup", finishReorder);
    window.addEventListener("pointercancel", finishReorder);
    window.addEventListener("scroll", clearPressTimer, true);

    searchEl.addEventListener("input", render);
    createEventBtn?.addEventListener("click", createEventLayer);
    $("[data-refresh]").addEventListener("click", () => {
      render();
      showToast("대시보드를 새로고침했습니다.");
    });
    $("[data-all-on]").addEventListener("click", () => {
      const overrides = readOverrides();
      events.forEach((event) => {
        overrides[event.id] = true;
        overrides[eventKey(event)] = true;
      });
      writeOverrides(overrides);
      render();
      showToast("전체 선택창을 노출 ON으로 저장했습니다.");
    });
    $("[data-all-off]").addEventListener("click", () => {
      const overrides = readOverrides();
      events.forEach((event) => {
        overrides[event.id] = false;
        overrides[eventKey(event)] = false;
      });
      writeOverrides(overrides);
      render();
      showToast("전체 선택창을 비노출 OFF로 저장했습니다.");
    });
    document.querySelectorAll("[data-nav]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-nav]").forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        const label = button.childNodes[0]?.textContent?.trim() || "메뉴";
        if (button.dataset.nav === "events") {
          showToast("선택창 관리 화면입니다.");
          return;
        }
        showToast(`${label} 화면은 아직 연결 전입니다.`);
      });
    });
    listEl.addEventListener("submit", (event) => {
      const formEl = event.target.closest("[data-edit-form]");
      if (!formEl) return;
      event.preventDefault();
      const item = events.find((entry) => entry.id === formEl.dataset.editId);
      if (!item) return;
      const form = new FormData(formEl);
      item.station = String(form.get("station") || item.station).trim() || item.station;
      item.title = String(form.get("title") || item.title).trim() || item.title;
      item.target = String(form.get("target") || item.target).trim() || item.target;
      item.date = String(form.get("date") || "").trim() || "상시 모집";
      item.place = String(form.get("place") || "").trim() || "부산 클로버 라운지 (승인 후 안내)";
      item.male = String(form.get("male") || "").trim() || "6";
      item.female = String(form.get("female") || "").trim() || "6";
      item.capacity = String(form.get("capacity") || "").trim() || "12명";
      item.price = String(form.get("price") || "").trim() || "50,000원";
      item.image = String(form.get("image") || item.image || "").trim();
      item.imageUrl = adminImageUrl(item.image);
      const active = form.get("active") !== "false";
      const overrides = readOverrides();
      overrides[item.id] = active;
      overrides[eventKey(item)] = active;
      writeOverrides(overrides);
      const edits = readEdits();
      edits[item.id] = {
        station: item.station,
        title: item.title,
        target: item.target,
        date: item.date,
        place: item.place,
        male: item.male,
        female: item.female,
        capacity: item.capacity,
        price: item.price,
        image: item.image,
        imageUrl: item.imageUrl
      };
      writeEdits(edits);
      if (isCustomEvent(item)) persistCustomEvents();
      editingEventId = "";
      render();
      showToast(`${item.title} 전체 수정 저장됨`);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && editingEventId) closeEditModal();
    });

    window.addEventListener("storage", (event) => {
      if (event.key === EVENT_ORDER_OVERRIDE_KEY) {
        events.splice(0, events.length, ...applySavedOrder(events));
        render();
        return;
      }
      if (event.key === EVENT_CUSTOM_OVERRIDE_KEY || event.key === EVENT_EDIT_OVERRIDE_KEY || event.key === EVENT_DELETED_OVERRIDE_KEY) {
        events.splice(0, events.length, ...applySavedOrder(managedEvents()));
        render();
        return;
      }
      if (event.key === EVENT_ACTIVE_OVERRIDE_KEY) render();
    });

    render();
  </script>
</body>
</html>
