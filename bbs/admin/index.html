<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLOVER 관리자 모드</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <script src="../../config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --accent: #00ff40;
      --accent-soft: rgba(0, 255, 64, .16);
      --bg: #101010;
      --panel: #1f1f1f;
      --panel-2: #242424;
      --ink: #f7f9fb;
      --muted: #b8c0ca;
      --line: #303030;
      --shadow: 8px 10px 24px rgba(0,0,0,.35), -4px -4px 12px rgba(255,255,255,.03);
      --inset: inset 4px 4px 10px rgba(0,0,0,.45), inset -3px -3px 8px rgba(255,255,255,.04);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    .remote-top {
      display: grid;
      gap: 12px;
      padding-bottom: 4px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 3px 0 5px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: linear-gradient(145deg, #262626, #151515 68%);
      border: 1px solid rgba(255,255,255,.04);
      box-shadow: inset 5px 5px 11px rgba(0,0,0,.58), inset -4px -4px 9px rgba(255,255,255,.055), 6px 8px 16px rgba(0,0,0,.32);
    }
    .brand-mark img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 1px 0 rgba(255,255,255,.18)) drop-shadow(0 5px 9px rgba(0,0,0,.58));
      opacity: .98;
    }
    .brand-copy { min-width: 0; flex: 1 1 auto; }
    .brand strong {
      display: block;
      color: #f7f9fb;
      font-size: 21px;
      line-height: .95;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255,255,255,.14), 0 7px 14px rgba(0,0,0,.5);
    }
    .brand span {
      display: block;
      margin-top: 5px;
      color: #d8dde3;
      font-size: 11px;
      line-height: 1.1;
      font-weight: 900;
      text-shadow: 0 1px 0 rgba(255,255,255,.1), 0 5px 10px rgba(0,0,0,.45);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid #343434;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }
    .icon-btn:active {
      transform: translateY(1px);
      box-shadow: var(--inset);
    }
    .link-btn, .soft-btn, .toggle-btn, .nav-btn {
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--ink);
      box-shadow: var(--shadow);
      min-height: 48px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .link-btn:active, .soft-btn:active, .toggle-btn:active, .nav-btn:active {
      transform: translateY(1px);
      box-shadow: var(--inset);
    }
    .layout {
      width: min(1420px, calc(100% - 28px));
      margin: 14px auto 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
      gap: 16px;
      align-items: start;
    }
    main { min-width: 0; }
    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .remote-nav { display: grid; gap: 12px; }
    .nav-btn {
      justify-content: space-between;
      width: 100%;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.04), 4px 5px 12px rgba(0, 0, 0, .28);
    }
    .nav-btn.is-active { outline: 2px solid var(--accent); background: #1f2b22; color: #fff; }
    .nav-group {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .nav-group:not(.is-open) .nav-submenu {
      display: none;
    }
    .nav-submenu {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid #303030;
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 4px 4px 10px rgba(0,0,0,.36), inset -2px -2px 7px rgba(255,255,255,.035);
    }
    .nav-submenu .page-head { gap: 4px; }
    .nav-submenu h1 { font-size: 18px; }
    .nav-submenu .sub { font-size: 11px; }
    .nav-submenu .metric {
      border-radius: 12px;
      background: #202020;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.035), 3px 4px 10px rgba(0,0,0,.22);
    }
    .nav-submenu .metric strong { font-size: 24px; }
    .nav-divider {
      height: 1px;
      margin: 4px 0;
      background: var(--line);
      opacity: .9;
    }
    .count-pill {
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      background: #050805;
      color: #fff;
      font-size: 12px;
    }
    .page-head {
      display: grid;
      gap: 7px;
      margin: 0;
    }
    h1 { margin: 0; font-size: 26px; line-height: 1.05; }
    .sub { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
    }
    .metric, .panel, .event-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .metric { min-width: 0; padding: 12px 10px; }
    .metric span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 8px; white-space: nowrap; }
    .metric strong { font-size: 28px; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0;
    }
    .toolbar .search { grid-column: 1 / -1; }
    .search {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 16px;
      outline: 0;
      box-shadow: inset 2px 2px 6px rgba(0, 0, 0, .28);
    }
    .panel { padding: 14px; }
    .admin-panel[hidden] { display: none !important; }
    .dashboard-panel {
      display: grid;
      gap: 12px;
    }
    .dashboard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 2px;
    }
    .dashboard-head h1 {
      font-size: 22px;
    }
    .dashboard-head-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .dashboard-list {
      display: grid;
      gap: 10px;
    }
    .dashboard-maker {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(0, 255, 64, .22);
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 12px 24px rgba(0,0,0,.2);
    }
    .dashboard-maker[hidden] {
      display: none !important;
    }
    .dashboard-maker-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .dashboard-maker .create-btn {
      width: auto;
      min-height: 42px;
      padding: 0 22px;
      font-size: 15px;
    }
    .dashboard-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-2);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.035), 4px 5px 12px rgba(0,0,0,.22);
    }
    .dashboard-item.has-thumb {
      grid-template-columns: 132px minmax(0, 1fr);
    }
    .dashboard-thumb {
      grid-row: 1 / span 4;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      overflow: hidden;
      background: #151515;
      border: 1px solid rgba(255,255,255,.06);
    }
    .dashboard-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dashboard-item strong {
      font-size: 15px;
      line-height: 1.25;
    }
    .dashboard-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .dashboard-episode-badge {
      min-width: 40px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      background: #161616;
      color: #f4f7fb;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.04);
      font-size: 13px;
      font-weight: 950;
      flex: 0 0 auto;
    }
    .dashboard-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .dashboard-item .dashboard-board-body {
      color: #eef5ff;
      font-size: 13px;
      font-weight: 800;
      white-space: pre-wrap;
    }
    .dashboard-item .dashboard-board-reply {
      color: #a7f3d0;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .dashboard-board-card {
      gap: 0;
      padding: 0;
      overflow: hidden;
    }
    .dashboard-board-toggle {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      width: 100%;
      padding: 15px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .dashboard-board-summary {
      display: grid;
      gap: 7px;
      min-width: 0;
    }
    .dashboard-board-status {
      align-self: start;
      min-width: 52px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #252525;
      color: #e8eef6;
      font-size: 12px;
      font-weight: 950;
      text-align: center;
      border: 1px solid rgba(255,255,255,.08);
    }
    .dashboard-board-status.is-complete {
      background: rgba(0, 255, 64, .14);
      color: #7bff9b;
    }
    .dashboard-board-status.is-checked {
      background: rgba(80, 150, 255, .16);
      color: #9fc5ff;
    }
    .dashboard-board-details {
      display: none;
      gap: 12px;
      padding: 0 15px 15px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .dashboard-board-card.is-open .dashboard-board-details {
      display: grid;
    }
    .dashboard-board-message,
    .dashboard-board-reply-box {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      background: #171717;
      border: 1px solid rgba(255,255,255,.07);
    }
    .dashboard-board-message-head,
    .dashboard-board-reply-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .dashboard-board-message-title,
    .dashboard-board-reply-title {
      color: #f5f8fb;
      font-size: 13px;
      font-weight: 950;
    }
    .dashboard-board-message-time,
    .dashboard-board-reply-message {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .dashboard-board-message-text,
    .dashboard-board-reply-text {
      margin: 0;
      color: #dce6ef;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .dashboard-board-message.is-admin .dashboard-board-message-text {
      color: #b7f7c7;
    }
    .dashboard-board-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .dashboard-board-attachments a {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(147, 197, 253, .24);
      background: rgba(59, 130, 246, .13);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 950;
      text-decoration: none;
      word-break: break-word;
    }
    .dashboard-board-reply-box textarea {
      min-height: 110px;
      resize: vertical;
    }
    .dashboard-board-save {
      width: auto;
      min-height: 38px;
      padding: 0 18px;
      font-size: 14px;
    }
    .dashboard-meta {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.35;
    }
    .dashboard-item-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 2px;
    }
    .dashboard-item.is-off {
      opacity: .55;
      filter: grayscale(.35);
    }
    .event-list { display: grid; gap: 12px; }
    .create-layer-wrap {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .create-btn {
      width: 100%;
      min-height: 54px;
      border-radius: 14px;
      background: var(--accent);
      color: #061008;
      font-size: 17px;
      font-weight: 950;
      box-shadow: 5px 7px 16px rgba(0, 255, 64, .22), inset -2px -2px 6px rgba(0,0,0,.16), inset 2px 2px 6px rgba(255,255,255,.28);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .create-btn:active {
      transform: translateY(1px);
      box-shadow: inset 4px 4px 10px rgba(0,0,0,.18), inset -3px -3px 8px rgba(255,255,255,.22);
    }
    .create-btn.is-party {
      background: #1f1f1f;
      color: var(--accent);
      border: 1px solid rgba(0, 255, 64, .45);
      box-shadow: 5px 7px 16px rgba(0, 0, 0, .22), inset 1px 1px 0 rgba(255,255,255,.055);
    }
    .event-list.is-reordering { cursor: grabbing; }
    .event-list.is-reordering .event-card:not(.is-dragging) { cursor: grabbing; }
    .event-card {
      position: relative;
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr) 126px;
      gap: 12px;
      padding: 12px;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      cursor: grab;
      transition: border-color .16s ease, box-shadow .16s ease, opacity .16s ease, transform .16s ease, background .16s ease;
    }
    .event-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(0, 255, 64, .08), rgba(0, 255, 64, 1));
      box-shadow: 0 0 18px rgba(0, 255, 64, .75);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
      pointer-events: none;
    }
    .event-card::after {
      content: "";
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 3;
      min-width: 58px;
      padding: 6px 10px;
      border: 1px solid rgba(0, 255, 64, .45);
      border-radius: 999px;
      background: rgba(6, 16, 8, .9);
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .34), 0 0 16px rgba(0, 255, 64, .28);
      opacity: 0;
      transform: translateY(-4px) scale(.96);
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .event-card.is-off { opacity: .58; }
    .event-card.is-pressing {
      border-color: rgba(0, 255, 64, .48);
      box-shadow: 0 0 0 2px rgba(0, 255, 64, .12), 0 14px 26px rgba(0, 0, 0, .3);
      transform: scale(.997);
      cursor: grabbing;
    }
    .event-card.is-pressing::before {
      opacity: 1;
      animation: hold-progress .52s linear forwards;
    }
    .event-card.is-dragging {
      border-color: rgba(0, 255, 64, .95);
      background: #20251f;
      box-shadow: 0 0 0 3px rgba(0, 255, 64, .26), 0 24px 46px rgba(0, 0, 0, .48), 0 0 30px rgba(0, 255, 64, .16);
      transform: translateY(-4px) scale(1.012);
      opacity: .94;
      cursor: grabbing;
      z-index: 5;
    }
    .event-card.is-dragging::before {
      opacity: 1;
      transform: scaleX(1);
      animation: none;
    }
    .event-card.is-dragging::after {
      content: "이동 중";
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .event-card.is-dragging .thumb {
      box-shadow: inset 0 0 0 2px rgba(0, 255, 64, .52);
      filter: saturate(1.15) brightness(1.08);
    }
    @keyframes hold-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #252a31;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .event-main {
      min-width: 0;
      display: contents;
    }
    .meta {
      min-width: 0;
      display: grid;
      gap: 5px;
    }
    .station {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #62f28f;
      font-size: 13px;
      margin-bottom: 0;
      font-weight: 950;
    }
    .station::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0,255,64,.7);
    }
    .title {
      font-size: 19px;
      line-height: 1.24;
      margin-bottom: 0;
      word-break: keep-all;
      color: #f5f7fb;
    }
    .desc {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }
    .mini {
      margin-top: 1px;
      color: #62f28f;
      font-size: 12px;
      line-height: 1.45;
      word-break: keep-all;
    }
    .event-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      justify-items: stretch;
      align-self: center;
      justify-self: end;
      width: 126px;
    }
    .toggle-btn {
      min-height: 48px;
      border-radius: 10px;
      padding: 0;
      font-size: 15px;
    }
    .toggle-btn.is-on { background: var(--accent); color: #061008; box-shadow: 5px 7px 16px rgba(0, 255, 64, .22), -4px -4px 10px rgba(255,255,255,.03); }
    .toggle-btn.is-off { color: #9aa4b2; background: #252525; border: 1px solid #343434; }
    .event-actions .toggle-btn,
    .event-actions .small-btn {
      min-height: 30px;
      border-radius: 8px;
      padding: 0;
      font-size: 12px;
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24);
    }
    .event-actions .toggle-btn.is-on {
      background: #242424;
      border: 1px solid #343434;
      color: var(--accent);
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24), inset 0 0 0 1px rgba(0, 255, 64, .08);
    }
    .event-actions .toggle-btn.is-off {
      color: #9aa4b2;
      background: #242424;
      border: 1px solid #343434;
    }
    .small-btn {
      min-height: 36px;
      border-radius: 9px;
      background: #242424;
      border: 1px solid #343434;
      color: #fff;
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24);
    }
    .danger-btn {
      color: #ff7b7b;
      border-color: rgba(255, 96, 96, .42);
      background: #241818;
      box-shadow: 2px 3px 9px rgba(0, 0, 0, .24), inset 0 0 0 1px rgba(255, 96, 96, .06);
    }
    .empty {
      display: none;
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
    }
    .empty.is-visible { display: block; }
    .list-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.4rem 0;
    }
    .list-loading-spinner {
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      border: 2.5px solid rgba(120, 128, 140, 0.25);
      border-top-color: #22c55e;
      animation: list-loading-spin 0.7s linear infinite;
    }
    .dashboard-loading {
      min-height: 108px;
      flex-direction: column;
      gap: 10px;
      color: #dbeafe;
      font-size: 14px;
      font-weight: 800;
    }
    @keyframes list-loading-spin {
      to { transform: rotate(360deg); }
    }
    .toast {
      position: fixed;
      left: 50%;
      top: max(14px, env(safe-area-inset-top));
      bottom: auto;
      z-index: 100;
      min-width: min(360px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      padding: 13px 16px;
      border: 1px solid rgba(0, 255, 64, .35);
      border-radius: 12px;
      background: #181f1a;
      color: var(--ink);
      box-shadow: 0 16px 30px rgba(0, 0, 0, .38);
      text-align: center;
      transform: translate(-50%, -16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }
    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .edit-layer {
      margin-top: -2px;
      border: 1px solid rgba(0, 255, 64, .28);
      border-radius: 14px;
      background: #181818;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 16px 32px rgba(0,0,0,.28);
    }
    .edit-form { display: grid; gap: 14px; padding: 16px; }
    .edit-head, .edit-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .edit-head h2 { margin: 0; font-size: 18px; }
    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .edit-field { display: grid; gap: 7px; min-width: 0; color: var(--muted); font-size: 12px; }
    .edit-field.is-wide { grid-column: 1 / -1; }
    .edit-field input, .edit-field textarea, .edit-field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #121212;
      color: var(--ink);
      padding: 10px 12px;
      outline: 0;
      font: inherit;
    }
    .edit-field textarea { min-height: 82px; resize: vertical; }
    .edit-actions { justify-content: flex-end; }
    .schedule-maker {
      display: grid;
      gap: 14px;
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid rgba(0, 255, 64, .22);
      border-radius: 16px;
      background: #181818;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 16px 32px rgba(0,0,0,.22);
    }
    .schedule-maker-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
    }
    .schedule-maker-head h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .schedule-maker-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .schedule-date-field {
      display: grid;
      gap: 8px;
    }
    .schedule-address-preview {
      display: grid;
      gap: 6px;
    }
    .schedule-address-preview-label {
      color: var(--muted);
      font-size: 12px;
    }
    .schedule-address-preview-map {
      position: relative;
      height: 160px;
      border: 1px solid #343434;
      border-radius: 14px;
      background: #121212;
      overflow: hidden;
    }
    .schedule-address-preview-status {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .schedule-address-preview-status.is-ok { color: #00ff40; }
    .schedule-address-preview-status.is-error { color: #ff5b5b; }
    .schedule-date-calendar {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #343434;
      border-radius: 14px;
      background: #121212;
    }
    .schedule-date-calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .schedule-date-calendar-title {
      font-size: 15px;
      font-weight: 950;
      color: var(--ink);
    }
    .schedule-date-calendar-nav {
      display: inline-flex;
      gap: 6px;
    }
    .schedule-date-calendar-nav button {
      width: 32px;
      height: 32px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #1f1f1f;
      color: var(--ink);
      font-weight: 950;
    }
    .schedule-date-week,
    .schedule-date-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }
    .schedule-date-week span {
      min-height: 22px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
    }
    .schedule-date-day {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 950;
    }
    .schedule-date-day.is-selected {
      border-color: #00ff40;
      background: rgba(0, 255, 64, .14);
      color: #7bff9b;
    }
    .schedule-date-day.is-muted {
      color: #505862;
    }
    .schedule-date-day.is-today {
      border-color: rgba(255,255,255,.22);
    }
    .schedule-layer-list {
      display: grid;
      gap: 10px;
    }
    .schedule-layer-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .schedule-layer-card:hover {
      border-color: rgba(0, 255, 64, .4);
    }
    .schedule-layer-card.is-selected {
      border-color: #00ff40;
      background: #1b2b1e;
      box-shadow: 0 0 0 2px rgba(0, 255, 64, .35), var(--shadow);
      position: relative;
    }
    .schedule-layer-card.is-selected::before {
      content: "수정 중";
      position: absolute;
      top: -9px;
      left: 14px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #00ff40;
      color: #07150b;
      font-size: 11px;
      font-weight: 950;
    }
    .schedule-layer-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 17px;
      line-height: 1.25;
    }
    .schedule-layer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .schedule-layer-meta span {
      padding: 4px 8px;
      border-radius: 999px;
      background: #252525;
      color: #dfe5ec;
    }
    .schedule-layer-meta .is-source {
      background: rgba(0, 255, 64, .12);
      color: #7bff9b;
    }
    .schedule-layer-card.is-default {
      border-color: rgba(255,255,255,.08);
      opacity: .78;
    }
    .schedule-layer-card.is-closed {
      border-color: rgba(255,255,255,.06);
      background: #151515;
      box-shadow: none;
      opacity: .48;
      filter: grayscale(.45);
    }
    .schedule-layer-card.is-closed .schedule-layer-meta span {
      background: #202020;
      color: #8f98a3;
    }
    .schedule-layer-episode {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.25rem;
      min-height: 1.45rem;
      margin-right: .35rem;
      padding: .1rem .45rem;
      border-radius: 999px;
      background: rgba(0, 255, 64, .14);
      color: #7bff9b;
      font-size: .78rem;
      font-weight: 950;
      vertical-align: .08rem;
    }
    .schedule-layer-card button:disabled {
      cursor: default;
      opacity: .6;
    }
    .schedule-card-actions {
      display: inline-flex;
      justify-content: flex-end;
      gap: 6px;
    }
    @media (max-width: 620px) {
      .edit-grid { grid-template-columns: 1fr; }
      .schedule-maker-head { align-items: stretch; flex-direction: column; }
      .schedule-maker-grid { grid-template-columns: 1fr; }
      .schedule-layer-card { grid-template-columns: 1fr; }
      .schedule-card-actions { justify-content: flex-start; }
    }
    .link-btn, .soft-btn, .nav-btn, .small-btn { border-color: #343434; }
    .search { background: #1f1f1f; }
    @media (max-width: 640px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; grid-row: 1; max-height: none; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .event-card { grid-template-columns: 140px minmax(0, 1fr) 126px; }
      .event-actions { grid-column: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar .search { grid-column: auto; }
      .event-card { grid-template-columns: 120px minmax(0, 1fr); }
      .event-actions { grid-column: 1 / -1; width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="layout">
    <main>
      <section class="panel admin-panel" data-admin-panel="events" hidden>
        <div class="event-list" data-list></div>
        <div class="empty" data-empty>검색 결과가 없습니다.</div>
        <div class="create-layer-wrap">
          <button class="create-btn" type="button" data-create-event="rotation">로테이션 소개팅 생성</button>
        </div>
      </section>
      <section class="panel admin-panel" data-admin-panel="events2" hidden>
        <div class="event-list" data-party-list></div>
        <div class="empty" data-party-empty>검색 결과가 없습니다.</div>
        <div class="create-layer-wrap">
          <button class="create-btn is-party" type="button" data-create-event="party">소모임 · 파티 생성</button>
        </div>
      </section>
      <section class="panel admin-panel" data-admin-panel="schedule">
        <div class="schedule-layer-list" data-schedule-layer-list></div>
        <div class="empty" data-schedule-empty>등록된 일정 안내 레이어가 없습니다.</div>
      </section>
      <section class="panel admin-panel dashboard-panel" data-admin-panel="clover" hidden>
        <div class="dashboard-head">
          <h1>클로버 근황</h1>
          <span class="dashboard-head-actions">
            <button class="soft-btn" type="button" data-dashboard-create="clover">등록</button>
            <button class="soft-btn" type="button" data-dashboard-refresh>새로고침</button>
          </span>
        </div>
        <form class="dashboard-maker" data-dashboard-maker="clover" hidden>
          <input type="hidden" name="id">
          <div class="dashboard-maker-grid">
            <label class="edit-field">제목<input name="title" placeholder="제목을 입력해 주세요."></label>
            <label class="edit-field">노출<select name="active"><option value="true">노출 ON</option><option value="false">비노출 OFF</option></select></label>
            <label class="edit-field is-wide">이미지 URL<input name="imageUrl" placeholder="assets/clover-proof-01.jpg 또는 Cloudinary URL"></label>
            <label class="edit-field is-wide">이미지 첨부<input type="file" name="imageFile" accept="image/*"></label>
            <label class="edit-field is-wide">내용<textarea name="content" placeholder="내용을 작성해 주세요."></textarea></label>
          </div>
          <div class="edit-actions">
            <button class="small-btn" type="button" data-dashboard-cancel>취소</button>
            <button class="create-btn" type="submit">등록</button>
          </div>
        </form>
        <div class="dashboard-list" data-dashboard-list="clover"></div>
      </section>
      <section class="panel admin-panel dashboard-panel" data-admin-panel="field" hidden>
        <div class="dashboard-head">
          <h1>현장</h1>
          <span class="dashboard-head-actions">
            <button class="soft-btn" type="button" data-dashboard-create="field">등록</button>
            <button class="soft-btn" type="button" data-dashboard-refresh>새로고침</button>
          </span>
        </div>
        <form class="dashboard-maker" data-dashboard-maker="field" hidden>
          <input type="hidden" name="id">
          <div class="dashboard-maker-grid">
            <label class="edit-field">제목<input name="title" placeholder="제목을 입력해 주세요."></label>
            <label class="edit-field">노출<select name="active"><option value="true">노출 ON</option><option value="false">비노출 OFF</option></select></label>
            <label class="edit-field is-wide">이미지 URL<input name="imageUrl" placeholder="assets/field-venue-01.jpg 또는 Cloudinary URL"></label>
            <label class="edit-field is-wide">이미지 첨부<input type="file" name="imageFile" accept="image/*"></label>
            <label class="edit-field is-wide">내용<textarea name="content" placeholder="내용을 작성해 주세요."></textarea></label>
          </div>
          <div class="edit-actions">
            <button class="small-btn" type="button" data-dashboard-cancel>취소</button>
            <button class="create-btn" type="submit">등록</button>
          </div>
        </form>
        <div class="dashboard-list" data-dashboard-list="field"></div>
      </section>
      <section class="panel admin-panel dashboard-panel" data-admin-panel="match" hidden>
        <div class="dashboard-head">
          <h1>매칭결과</h1>
          <span class="dashboard-head-actions">
            <button class="soft-btn" type="button" data-dashboard-create="match">등록</button>
            <button class="soft-btn" type="button" data-dashboard-refresh>새로고침</button>
          </span>
        </div>
        <form class="dashboard-maker" data-dashboard-maker="match" hidden>
          <input type="hidden" name="id">
          <div class="dashboard-maker-grid">
            <label class="edit-field">회차<input name="episode" type="number" min="1" step="1" placeholder="자동 적용" readonly></label>
            <label class="edit-field">제목<input name="title" placeholder="예: 17화 소개팅 종료"></label>
            <label class="edit-field">날짜<input type="date" name="scheduleDate"></label>
            <label class="edit-field">시간<input name="scheduleTime" placeholder="예: 19시"></label>
            <label class="edit-field">노출<select name="active"><option value="true">노출 ON</option><option value="false">비노출 OFF</option></select></label>
            <label class="edit-field">나이<input name="ageRange" list="dashboardAgeOptions" placeholder="양식2 나이 선택 또는 직접 입력"></label>
            <label class="edit-field">남성 인원<input name="male" type="number" min="0" step="1" placeholder="예: 1"></label>
            <label class="edit-field">여성 인원<input name="female" type="number" min="0" step="1" placeholder="예: 1"></label>
            <label class="edit-field">매칭 수<input name="matchCount" type="number" min="0" step="1" placeholder="예: 0"></label>
            <label class="edit-field is-wide">내용<textarea name="content" placeholder="매칭 결과 내용을 작성해 주세요."></textarea></label>
          </div>
          <div class="edit-actions">
            <button class="small-btn" type="button" data-dashboard-cancel>취소</button>
            <button class="create-btn" type="submit">등록</button>
          </div>
        </form>
        <datalist id="dashboardAgeOptions"></datalist>
        <div class="dashboard-list" data-dashboard-list="match"></div>
      </section>
      <section class="panel admin-panel dashboard-panel" data-admin-panel="counsel" hidden>
        <div class="dashboard-head">
          <h1>연애상담</h1>
          <span class="dashboard-head-actions">
            <button class="soft-btn" type="button" data-dashboard-create="counsel">등록</button>
            <button class="soft-btn" type="button" data-dashboard-refresh>새로고침</button>
          </span>
        </div>
        <form class="dashboard-maker" data-dashboard-maker="counsel" hidden>
          <input type="hidden" name="id">
          <div class="dashboard-maker-grid">
            <label class="edit-field">제목<input name="title" placeholder="제목을 입력해 주세요."></label>
            <label class="edit-field">노출<select name="active"><option value="true">노출 ON</option><option value="false">비노출 OFF</option></select></label>
            <label class="edit-field is-wide">내용<textarea name="content" placeholder="상담 내용을 작성해 주세요."></textarea></label>
          </div>
          <div class="edit-actions">
            <button class="small-btn" type="button" data-dashboard-cancel>취소</button>
            <button class="create-btn" type="submit">등록</button>
          </div>
        </form>
        <div class="dashboard-list" data-dashboard-list="counsel"></div>
      </section>
      <section class="panel admin-panel dashboard-panel" data-admin-panel="application" hidden>
        <div class="dashboard-head">
          <h1>신청 접수</h1>
          <button class="soft-btn" type="button" data-dashboard-refresh>새로고침</button>
        </div>
        <div class="dashboard-list" data-dashboard-list="application"></div>
      </section>
      <section class="panel admin-panel dashboard-panel" data-admin-panel="board" hidden>
        <div class="dashboard-head">
          <h1>문의 하기</h1>
          <button class="soft-btn" type="button" data-dashboard-refresh>새로고침</button>
        </div>
        <div class="dashboard-list" data-dashboard-list="board"></div>
      </section>
    </main>

    <aside class="side remote-control" aria-label="관리자 리모콘">
      <section class="remote-top" aria-label="관리자 상단 리모콘">
        <div class="brand" aria-label="CLOVER 로테이션 소개팅">
          <span class="brand-mark" aria-hidden="true"><img src="../../assets/clover-logo-v2.png" alt=""></span>
          <div class="brand-copy">
            <strong>CLOVER</strong>
            <span>로테이션 소개팅</span>
          </div>
          <button class="icon-btn" type="button" data-refresh aria-label="새로고침" title="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
        </div>
      </section>

      <nav class="remote-nav" aria-label="관리자 메뉴">
        <div class="nav-group is-open" data-nav-group="schedule">
          <button class="nav-btn is-active" type="button" data-nav="schedule">일정 관리 <span class="count-pill" data-schedule-menu-count>0</span></button>
          <div class="nav-submenu" aria-label="일정 관리 하위 메뉴">
            <form class="schedule-maker" data-schedule-maker>
              <div class="schedule-maker-head">
                <div class="page-head">
                  <h1>일정 안내 생성</h1>
                  <p class="sub">날짜와 시간을 선택하면 메인 일정 안내 달력 아래 카드 레이어로 표시됩니다.</p>
                </div>
              </div>
              <div class="schedule-maker-grid">
                <div class="edit-field schedule-date-field is-wide">날짜
                  <input name="scheduleDate" type="hidden" required>
                  <div class="schedule-date-calendar" data-schedule-date-calendar></div>
                </div>
                <label class="edit-field">인원 구성
                  <select name="meetingMode">
                    <option value="1:1">1:1</option>
                    <option value="6:6">6:6</option>
                  </select>
                </label>
                <label class="edit-field">연령대
                  <input name="ageRange" autocomplete="off" value="27-36세">
                </label>
                <label class="edit-field">상태
                  <select name="active">
                    <option value="true">노출</option>
                    <option value="false">비노출</option>
                  </select>
                </label>
                <label class="edit-field">시간
                  <select name="scheduleTime" required>
                    <option value="">시간 선택</option>
                    <option value="10시">오전 10:00</option>
                    <option value="11시">오전 11:00</option>
                    <option value="12시">오후 12:00</option>
                    <option value="13시">오후 01:00</option>
                    <option value="14시">오후 02:00</option>
                    <option value="15시">오후 03:00</option>
                    <option value="16시">오후 04:00</option>
                    <option value="17시">오후 05:00</option>
                    <option value="18시">오후 06:00</option>
                    <option value="19시">오후 07:00</option>
                    <option value="20시">오후 08:00</option>
                    <option value="21시">오후 09:00</option>
                  </select>
                </label>
                <label class="edit-field is-wide">주소 (지도 반영)
                  <input name="address" autocomplete="off" placeholder="예: 부산 부산진구 서전로 8번길 27" value="부산 부산진구 서전로 8번길 27">
                </label>
                <div class="edit-field is-wide schedule-address-preview">
                  <span class="schedule-address-preview-label">지도 미리보기</span>
                  <div class="schedule-address-preview-map" data-address-preview-map></div>
                  <p class="schedule-address-preview-status" data-address-preview-status>주소를 입력하면 지도에 핀이 표시됩니다.</p>
                </div>
                <label class="edit-field is-wide">안내 문구
                  <textarea name="content">선택한 시간에 소개팅이 진행됩니다.</textarea>
                </label>
              </div>
              <div class="edit-actions">
                <button class="toggle-btn is-on" type="submit">생성</button>
              </div>
            </form>
          </div>
        </div>

        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ ...payload, adminPassword: ADMIN_PASSWORD })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.error || "저장 요청이 실패했습니다.");
      return result;
    }

    ]);

    const $ = (selector) => document.querySelector(selector);
    const listEl = $("[data-list]");

    const toastEl = $("[data-toast]");
    let toastTimer = 0;
    let editingEventId = "";

    let fallbackEdits = {};
    let fallbackCustomEvents = [];
    let fallbackDeletedEvents = [];
    let fallbackOrder = [];
    let editingScheduleId = "";
    let dashboardEditingIds = {};
    let dashboardLocalPosts = [];
    let dashboardDeletedIds = [];

    let dashboardLoadSeq = 0;
    let scheduleCalendarYear = 0;
    let scheduleCalendarMonth = 0;

    function eventPresetId(index) {
      return `clover-default-event-${String(index + 1).padStart(2, "0")}`;
    }

    function readOverrides() {
      try {
        fallbackOverrides = JSON.parse(localStorage.getItem(EVENT_ACTIVE_OVERRIDE_KEY) || "{}");
        return fallbackOverrides;
      } catch {
        return fallbackOverrides;
      }
    }

    function writeOverrides(overrides) {
      fallbackOverrides = { ...overrides };
      try { localStorage.setItem(EVENT_ACTIVE_OVERRIDE_KEY, JSON.stringify(fallbackOverrides)); } catch {}
    }

    function readEdits() {
      try {
        fallbackEdits = JSON.parse(localStorage.getItem(EVENT_EDIT_OVERRIDE_KEY) || "{}");
        return fallbackEdits;
      } catch {
        return fallbackEdits;
      }
    }

    function writeEdits(edits) {
      fallbackEdits = { ...edits };
      try { localStorage.setItem(EVENT_EDIT_OVERRIDE_KEY, JSON.stringify(fallbackEdits)); } catch {}
    }

    function readCustomEvents() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EVENT_CUSTOM_OVERRIDE_KEY) || "[]");
        fallbackCustomEvents = Array.isArray(parsed) ? parsed.filter((item) => item && typeof item === "object") : fallbackCustomEvents;
        return fallbackCustomEvents;
      } catch {
        return fallbackCustomEvents;
      }
    }

    function writeCustomEvents(customEvents) {
      fallbackCustomEvents = Array.isArray(customEvents) ? [...customEvents] : [];
      try { localStorage.setItem(EVENT_CUSTOM_OVERRIDE_KEY, JSON.stringify(fallbackCustomEvents)); } catch {}
    }

    function readOrder() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EVENT_ORDER_OVERRIDE_KEY) || "[]");
        fallbackOrder = Array.isArray(parsed) ? parsed : fallbackOrder;
        return fallbackOrder;
      } catch {
        return fallbackOrder;
      }
    }

    function writeOrder(order) {
      fallbackOrder = Array.isArray(order) ? [...order] : [];
      try { localStorage.setItem(EVENT_ORDER_OVERRIDE_KEY, JSON.stringify(fallbackOrder)); } catch {}
    }

    function readDeletedEvents() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EVENT_DELETED_OVERRIDE_KEY) || "[]");
        fallbackDeletedEvents = Array.isArray(parsed) ? parsed.map(String) : fallbackDeletedEvents;
        return fallbackDeletedEvents;
      } catch {
        return fallbackDeletedEvents;
      }
    }

    function writeDeletedEvents(ids) {
      fallbackDeletedEvents = Array.isArray(ids) ? [...new Set(ids.map(String))] : [];
      try { localStorage.setItem(EVENT_DELETED_OVERRIDE_KEY, JSON.stringify(fallbackDeletedEvents)); } catch {}
    }

    function applySavedOrder(list) {
      const savedOrder = readOrder();
      if (!savedOrder.length) return list;
      const rank = new Map(savedOrder.map((id, index) => [id, index]));
      return [...list].sort((a, b) => {
        const aRank = rank.has(a.id) ? rank.get(a.id) : Number.MAX_SAFE_INTEGER + a.order;
        const bRank = rank.has(b.id) ? rank.get(b.id) : Number.MAX_SAFE_INTEGER + b.order;
        return aRank - bRank;
      });
    }

    function updateEventOrders() {
      events.forEach((event, index) => {
        event.order = index + 1;
      });
    }

    async function saveEventsSequentially(list) {
      for (const event of list) {
        await apiPost(eventSavePayload(event));
      }
    }

    async function persistEventOrder() {
      updateEventOrders();
      writeOrder(events.map((event) => event.id));
      try {
        await saveEventsSequentially(events);
      } catch (error) {
        showToast(`순서 저장 실패: ${error.message}`);
      }
    }

    function isCustomEvent(event) {
      return String(event?.id || "").startsWith("clover-custom-event-");
    }

    function eventStorageData(event) {
      return {
        id: event.id,
        order: event.order,
        station: event.station,
        layerType: eventLayerType(event),
        title: event.title,
        target: event.target,
        date: event.date,
        place: event.place,
        male: event.male,
        female: event.female,
        capacity: event.capacity,
        price: event.price,
        malePrice: event.malePrice || event.price,
        femalePrice: event.femalePrice || "30,000원",
        oldPrice: event.oldPrice || "",
        image: event.image,
        imageUrl: event.imageUrl,
        badgeType: event.badgeType || "",
        form1Config: event.form1Config,
        form2Config: event.form2Config,
        form3Config: event.form3Config,
        active: isActive(event)
      };
    }

    function persistCustomEvents() {
      updateEventOrders();
      writeCustomEvents(events.filter(isCustomEvent).map(eventStorageData));
    }

    function moveEventTo(dragId, targetId, afterTarget = false) {
      if (!dragId || !targetId || dragId === targetId) return false;
      const before = events.map((event) => event.id).join("|");
      const from = events.findIndex((event) => event.id === dragId);
      if (from < 0) return false;
      const [moved] = events.splice(from, 1);
      const targetIndex = events.findIndex((event) => event.id === targetId);
      if (targetIndex < 0) {
        events.splice(from, 0, moved);
        return false;
      }
      events.splice(targetIndex + (afterTarget ? 1 : 0), 0, moved);
      if (events.map((event) => event.id).join("|") === before) return false;
      persistEventOrder();
      return true;
    }

    function isInteractiveReorderTarget(target) {
      return Boolean(target.closest("button, a, input, textarea, select, label, [data-edit-layer]"));
    }

    function clearPressFeedback() {
      pressingCardEl?.classList.remove("is-pressing");
      pressingCardEl = null;
    }

    function clearPressTimer() {
      if (pressTimer) window.clearTimeout(pressTimer);
      pressTimer = 0;
      clearPressFeedback();
    }

    function startReorder(eventId) {
      if (!events.some((event) => event.id === eventId)) return;
      clearPressTimer();
      draggingEventId = eventId;
      didReorderDrag = false;
      eventListElementForEvent(events.find((event) => event.id === eventId))?.classList.add("is-reordering");
      render();
      showToast("길게 누른 상태로 이동해 순서를 바꾸세요.");
    }

    function finishReorder() {
      clearPressTimer();
      if (!draggingEventId) return;
      const shouldToast = didReorderDrag;
      draggingEventId = "";
      didReorderDrag = false;
      listEl.classList.remove("is-reordering");
      partyListEl?.classList.remove("is-reordering");
      render();
      if (shouldToast) showToast("레이어 순서 저장됨");
    }

    function showToast(message) {
      if (!toastEl) return;
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toastEl.classList.remove("is-visible"), 1800);
    }

    function eventKey(event) {
      return `${event.station}::${event.title}`;
    }

    function eventBadgeAdminLabel(event) {
      const badgeType = String(event?.badgeType || "").trim();
      if (badgeType === "popular") return "인기";
      if (badgeType === "certified") return "인증";
      if (badgeType === "none") return "없음";
      const station = String(event?.station || "").trim();
      if (station === "랜덤") return "자동 인기";
      if (station === "맞춤") return "자동 인증";
      return "자동 없음";
    }

    function optimizedAssetPath(raw) {
      const match = raw.match(/^assets\/([^?#\/]+)\.(png|jpe?g)([?#].*)?$/i);
      if (!match) return raw;
      const name = match[1];
      if (/^(favicon|clover-logo)/i.test(name)) return raw;
      return `assets/optimized/${name}.webp${match[3] || ""}`;
    }

    function adminImageUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (/^data:image\//i.test(raw)) return raw;
      if (/^(https?:)?\/\//i.test(raw)) return raw;
      if (raw.startsWith("../../")) return raw;
      const optimized = optimizedAssetPath(raw.replace(/^\/+/, ""));
      return `../../${optimized}`;
    }

    const defaultLayerForm1Config = Object.freeze({
      enabled: false,
      copy: "",
      points: []
    });

    const defaultLayerForm2Config = Object.freeze({
      compositionOptions: ["1:1", "6:6"],
      ageOptions: ["20세 - 27세", "24세 - 29세", "27세 - 36세", "30세 - 37세", "34세 - 39세", "40세 - 47세", "44세 - 49세", "47세 - 56세", "50세 - 57세"],
      weekdayOptions: ["월", "화", "수", "목", "금", "토", "일", "상관없음", "유동일정"],
      noteEnabled: true
    });

    const defaultLayerForm3Config = Object.freeze({
      fields: ["basicInfo", "physicalInfo", "job", "idealRank", "documents", "contactMethod", "message", "agreements"]
    });

    function layerFormConfig(value, fallback) {
      if (value && typeof value === "object" && !Array.isArray(value)) return { ...fallback, ...value };
      if (typeof value === "string" && value.trim()) {
        try {
          const parsed = JSON.parse(value);
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return { ...fallback, ...parsed };
        } catch {}
      }
      return { ...fallback };
    }

    function layerFormConfigPayload(value, fallback) {
      return JSON.stringify(layerFormConfig(value, fallback));
    }

    function dashboardAgeOptions() {
      const options = new Set(defaultLayerForm2Config.ageOptions || []);
      events.forEach((event) => {
        layerFormConfig(event.form2Config, defaultLayerForm2Config).ageOptions.forEach((option) => {
          const text = String(option || "").trim();
          if (text) options.add(text);
        });
      });
      return [...options];
    }

    function renderDashboardAgeOptions() {
      const datalist = document.getElementById("dashboardAgeOptions");
      if (!datalist) return;
      datalist.innerHTML = dashboardAgeOptions().map((option) => `<option value="${htmlAttr(option)}"></option>`).join("");
    }

    function createEvent(preset, index) {
      const image = preset.image || preset.imageUrl || "";
      return {
        ...preset,
        id: preset.id || eventPresetId(index),
        order: Number(preset.order) || index + 1,
        date: preset.date || "상시 모집",
        place: preset.place || "부산 클로버 라운지 (승인 후 안내)",
        male: preset.male || "6",
        female: preset.female || "6",
        capacity: preset.capacity || "12명",
        price: preset.price || preset.malePrice || "50,000원",
        malePrice: preset.malePrice || preset.price || "50,000원",
        femalePrice: preset.femalePrice || "30,000원",
        layerType: preset.layerType || (["모임", "파티", "소모임 파티"].includes(String(preset.station || "").trim()) ? "party" : "rotation"),
        badgeType: preset.badgeType || "",
        form1Config: layerFormConfig(preset.form1Config, defaultLayerForm1Config),
        form2Config: layerFormConfig(preset.form2Config, defaultLayerForm2Config),
        form3Config: layerFormConfig(preset.form3Config, defaultLayerForm3Config),
        image,
        imageUrl: adminImageUrl(image)
      };
    }

    function applySavedEdit(event) {
      const edit = readEdits()[event.id];
      if (!edit) return event;
      const merged = { ...event, ...edit };
      merged.imageUrl = adminImageUrl(merged.image);
      return merged;
    }

    function managedEvents() {
      const deleted = new Set(readDeletedEvents());
      const defaults = eventCardPresets.map((preset, index) => applySavedEdit(createEvent(preset, index)));
      const custom = readCustomEvents().map((preset, index) => applySavedEdit(createEvent(preset, eventCardPresets.length + index)));
      return [...defaults, ...custom].filter((event) => !deleted.has(event.id));
    }

    function newCustomEventId() {
      let id = `clover-custom-event-${Date.now()}`;
      while (events.some((event) => event.id === id)) id = `clover-custom-event-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      return id;
    }

    function createBlankEvent(layerType = "rotation") {

    function readDashboardBoardStatusOverrides() {
      try {

    function writeDashboardBoardStatusOverride(id, status) {
      if (!id || !["접수", "확인", "완료"].includes(status)) return;
      const next = { ...readDashboardBoardStatusOverrides(), [String(id)]: status };
      try { localStorage.setItem(PUBLIC_BOARD_STATUS_OVERRIDE_KEY, JSON.stringify(next)); } catch {}
    }

    function readDashboardBoardAuthorOverrides() {

    function normalizeDashboardBoardAuthor(author) {
      const cleanAuthor = String(author || "").trim();
      return cleanAuthor === "익명" ? "" : cleanAuthor;
    }

    function uniqueDashboardItems(items) {
      const seen = new Set();
      return items.filter((item, index) => {
        const key = String(item?.id || `${item?.category || ""}-${item?.title || ""}-${item?.createdAt || index}`);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function isProtectedDashboardMatchItem(item, name = "") {
      const category = String(item?.category || dashboardPanelCategories[name] || "").trim();
      return category === "매칭결과" && Number(dashboardMatchEpisode(item)) === 16 && dashboardDateInputValue(item?.scheduleDate || item?.date || "") === "2026-08-09";
    }

    function isBlockedDashboardMatchDuplicate(item) {
      const category = String(item?.category || "").trim();
      if (category !== "매칭결과" || Number(dashboardMatchEpisode(item)) !== 16) return false;
      const date = dashboardDateInputValue(item?.scheduleDate || item?.date || "");
      const createdAt = Number(item?.createdAt);
      const createdDate = Number.isFinite(createdAt) ? new Date(createdAt).toISOString().slice(0, 10) : "";
      const male = Number(item?.male) || 0;
      const female = Number(item?.female) || 0;
      const age = String(item?.ageRange || item?.age || "").trim();
      return date === "2026-08-29" || createdDate === "2026-08-29" || (male === 3 && female === 3) || (!date && !age);
    }

    function cleanDashboardPosts(posts) {
      return (Array.isArray(posts) ? posts : []).filter((post) => !isBlockedDashboardMatchDuplicate(post));

    function mergeDashboardBoardPosts(...groups) {
      const byKey = new Map();
      const statusOverrides = readDashboardBoardStatusOverrides();
      const authorOverrides = readDashboardBoardAuthorOverrides();
      groups.flat().filter(Boolean).forEach((post, index) => {
        const key = String(post.id || `board-${post.author || ""}-${post.createdAt || index}`);
        const current = byKey.get(key) || {};
        const author = Object.prototype.hasOwnProperty.call(authorOverrides, key) ? authorOverrides[key] : (post.author || current.author);
        byKey.set(key, {
          ...current,
          ...post,
          author: normalizeDashboardBoardAuthor(author),
          content: String(post.content || "").trim() || current.content || "",
          question: String(post.question || "").trim() || current.question || "",
          message: String(post.message || "").trim() || current.message || "",
          reply: post.reply || current.reply || "",
          followUp: post.followUp || current.followUp || "",
          replies: post.replies || current.replies || [],
          followUps: post.followUps || current.followUps || [],
          attachments: normalizeDashboardBoardAttachments(post.attachments).length ? normalizeDashboardBoardAttachments(post.attachments) : normalizeDashboardBoardAttachments(current.attachments),
          status: (post.status || current.status) === "완료" ? "완료" : (statusOverrides[key] || post.status || current.status || "접수")
        });
      });
      return [...byKey.values()].sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
    }

    function scheduleTimeHour(time) {
      const match = String(time || "").match(/(\d{1,2})/);
      if (!match) return NaN;
      const hour = Number(match[1]);
      return hour >= 0 && hour <= 23 ? hour : NaN;
    }

    function scheduleTimeText(time) {
      const hour = scheduleTimeHour(time);
      if (Number.isNaN(hour)) return time || "";
      const period = hour < 12 ? "오전" : "오후";
      const displayHour = String(hour % 12 || 12).padStart(2, "0");
      return `${period} ${displayHour}:00`;
    }

      return "";
    }

    function dashboardTimeInputValue(value, fallbackHour = "") {

      return "";

    function scheduleEventTimestamp(iso, time) {
      const hour = scheduleTimeHour(time);
      if (!iso || Number.isNaN(hour)) return NaN;
      const [year, month, day] = String(iso).split("-").map(Number);
      if (!year || !month || !day) return NaN;
      return Date.UTC(year, month - 1, day, hour - 9, 0, 0);
    }

    function isScheduleClosed(post) {

    function scheduleDateText(iso) {

      const weekday = ["일", "월", "화", "수", "목", "금", "토"][new Date(`${iso}T00:00:00`).getDay()];
      return `${year}년 ${month}월 ${day}일(${weekday})`;
    }

    function adminScheduleSlotsForDayOfWeek(dayOfWeek) {

      if (dayOfWeek === 6 || dayOfWeek === 0) return ["13시", "16시", "19시"];
      return [];
    }

    function adminCalendarMonths() {
      const [year, month] = seoulTodayIso().split("-").map(Number);
      const first = new Date(year, month - 1, 1);
      return [0, 1, 2].map((offset) => {
        const date = new Date(first.getFullYear(), first.getMonth() + offset, 1);
        return { year: date.getFullYear(), month: date.getMonth() + 1 };
      });
    }

    function defaultAdminSchedulePosts() {
      const posts = [];
      const deletedSlots = readDeletedScheduleSlots();
      adminCalendarMonths().forEach(({ year, month }) => {
        const lastDate = new Date(year, month, 0).getDate();
        for (let day = 1; day <= lastDate; day += 1) {
          const iso = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dayOfWeek = new Date(`${iso}T00:00:00`).getDay();
          adminScheduleSlotsForDayOfWeek(dayOfWeek).forEach((time) => {
            if (deletedSlots.has(scheduleSlotKey({ scheduleDate: iso, scheduleTime: time }))) return;
            posts.push({
              id: `placeholder-${iso}-${time}`,
              scheduleDate: iso,
              scheduleTime: time,
              meetingMode: "1:1",
              ageRange: "27-36세",
              active: true,
              source: "기본"
            });
          });
        }
      });
      return posts;

    function scheduleSlotKey(post) {
      const hour = scheduleTimeHour(post.scheduleTime);

      return [
        ...defaultPosts.filter((post) => !adminSlotKeys.has(scheduleSlotKey(post))),
        ...adminPosts
      ].sort((a, b) => {
        const dateCompare = String(a.scheduleDate || "").localeCompare(String(b.scheduleDate || ""));
        if (dateCompare) return dateCompare;
        return (scheduleTimeHour(a.scheduleTime) || 0) - (scheduleTimeHour(b.scheduleTime) || 0);

    const naverMapClientId = "evk9pbogap";
    let naverMapScriptPromise = null;
    function loadNaverMapScript() {
      if (window.naver?.maps?.Service) return Promise.resolve();
      if (naverMapScriptPromise) return naverMapScriptPromise;
      naverMapScriptPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(naverMapClientId)}&submodules=geocoder`;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("네이버 지도를 불러오지 못했습니다."));
        document.head.appendChild(script);
      });
      return naverMapScriptPromise;
    }

    function geocodeAddress(address) {
      return new Promise((resolve, reject) => {
        if (!naver.maps.Service || !naver.maps.Service.geocode) {
          reject(new Error("geocoder submodule not loaded"));
          return;
        }
        naver.maps.Service.geocode({ query: address }, (status, response) => {
          if (status !== naver.maps.Service.Status.OK || !response?.v2?.addresses?.length) {
            reject(new Error("geocode failed"));
            return;
          }
          const item = response.v2.addresses[0];
          resolve({ lat: Number(item.y), lng: Number(item.x), roadAddress: item.roadAddress || item.jibunAddress || address });
        });
      });
    }

    let addressPreviewMap = null;

    async function renderAddressPreview(address) {
      const mapEl = scheduleMaker?.querySelector("[data-address-preview-map]");
      const statusEl = scheduleMaker?.querySelector("[data-address-preview-status]");
      if (!mapEl || !statusEl) return;
      const trimmed = String(address || "").trim();
      if (!trimmed) {
        statusEl.textContent = "주소를 입력하면 지도에 핀이 표시됩니다.";
        statusEl.className = "schedule-address-preview-status";
        return;
      }
      const requestId = ++addressPreviewRequestId;
      statusEl.textContent = "지도에서 위치를 확인하는 중...";
      statusEl.className = "schedule-address-preview-status";
      try {
        await loadNaverMapScript();
        const { lat, lng, roadAddress } = await geocodeAddress(trimmed);
        if (requestId !== addressPreviewRequestId) return;
        const position = new naver.maps.LatLng(lat, lng);
        if (!addressPreviewMap) {
          addressPreviewMap = new naver.maps.Map(mapEl, { center: position, zoom: 16, minZoom: 10 });
          addressPreviewMarker = new naver.maps.Marker({ position, map: addressPreviewMap });
        } else {
          addressPreviewMap.setCenter(position);
          addressPreviewMarker.setPosition(position);
        }
        window.setTimeout(() => naver.maps.Event.trigger(addressPreviewMap, "resize"), 60);
        statusEl.textContent = `지도에서 확인됨: ${roadAddress}`;
        statusEl.className = "schedule-address-preview-status is-ok";
      } catch {
        if (requestId !== addressPreviewRequestId) return;
        statusEl.textContent = "이 주소는 지도에서 찾을 수 없습니다. 정확한 도로명/지번 주소를 입력해 주세요.";
        statusEl.className = "schedule-address-preview-status is-error";
      }
    }

    async function createScheduleLayers(formEl) {
      const form = new FormData(formEl);
      const date = String(form.get("scheduleDate") || "").trim();
      const times = form.getAll("scheduleTime").map(String).filter(Boolean);
      if (!date) {
        showToast("일정 날짜를 선택해 주세요.");
        return;
      }
      if (!times.length) {
        showToast("일정 시간을 하나 이상 선택해 주세요.");
        return;
      }
      const meetingMode = String(form.get("meetingMode") || "1:1").trim() || "1:1";
      const ageRange = String(form.get("ageRange") || "27-36세").trim() || "27-36세";
      const address = String(form.get("address") || "").trim() || "부산 부산진구 서전로 8번길 27";
      const content = String(form.get("content") || "").trim() || "선택한 시간에 소개팅이 진행됩니다.";
      const active = form.get("active") !== "false";
      const wasEditing = !!editingScheduleId;
      const deletedSlots = readDeletedScheduleSlots();
      try {
        for (const time of times) {
          const id = schedulePostId(date, time);
          deletedSlots.delete(scheduleSlotKey({ scheduleDate: date, scheduleTime: time }));
          await apiPost({
            type: "schedulePostSave",
            id,
            category: "일정 안내",
            title: `${date} ${time} 소개팅 안내`,
            content,
            imageUrl: DASHBOARD_FIELD_IMAGES[0],
            scheduleDate: date,
            scheduleTime: time,
            meetingMode,
            ageRange,
            address,
            active
          });
        }
        writeDeletedScheduleSlots(deletedSlots);
        editingScheduleId = "";
        scheduleFormSubmitButtonText("생성");
        await loadAdminSchedulePosts();
        showToast(`${date} 일정 안내 ${times.length}개 ${wasEditing ? "수정" : "저장"}됨`);
      } catch (error) {
        showToast(`저장 실패: ${error.message}`);
      }
    }

    function dashboardMatchDisplayTitle(item, fallback) {
      const rawTitle = String(item?.title || fallback || "소개팅 종료").trim().replace(/^\d+\s*화\s*/, "") || "소개팅 종료";
      const date = dashboardDateInputValue(item?.scheduleDate || item?.date || "");
      if (!date) return rawTitle;
      const [year, month, day] = date.split("-").map(Number);
      if (!year || !month || !day) return rawTitle;
      const time = scheduleTimeText(dashboardTimeInputValue(item?.scheduleTime, item?.hour || 19));
      return `[${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")} ${time}] ${rawTitle}`;
    }

    function dashboardMatchEpisode(item) {
      const titleMatch = String(item?.title || "").match(/(\d+)\s*화/);
      if (titleMatch) return Number(titleMatch[1]);
      const idMatch = String(item?.id || "").match(/(?:match|episode)[^\d]*(\d+)/i);
      if (idMatch) return Number(idMatch[1]);
      return Number(item?.episode) || "";
    }

    function nextDashboardMatchEpisode() {
      const episodes = (dashboardData.match || [])
        .map((item) => Number(dashboardMatchEpisode(item)))
        .filter((episode) => Number.isFinite(episode) && episode > 0);
      return episodes.length ? Math.max(...episodes) + 1 : 1;
    }

    function setDashboardMatchEpisodeField(form, value) {
      const episodeInput = form?.querySelector('[name="episode"]');
      if (!episodeInput) return;
      episodeInput.readOnly = true;
      episodeInput.value = value || nextDashboardMatchEpisode();
    }

    function dashboardEditableTitle(item, name) {
      const title = String(item?.title || item?.headline || item?.eventTitle || item?.name || item?.author || dashboardPanelCategories[name] || "").trim();
      if (name !== "match") return title;
      return title.replace(/^\d+\s*화\s*/, "").replace(/^\[[^\]]+\]\s*/, "") || "소개팅 종료";
    }

    function dashboardItemTitle(item, fallback) {
      if (String(item?.category || "").trim() === "매칭결과") {
        return dashboardMatchDisplayTitle(item, fallback);
      }
      return item.title || item.headline || item.eventTitle || item.name || item.author || fallback;
    }

    function dashboardItemBody(item) {
      let body = item.content || item.summary || item.message || item.target || item.applicationNote || item.question || "";
      if (String(item?.category || "").trim() !== "매칭결과") return body;
      body = String(body).replace(/\s*·\s*남\s*\d+\s*\/\s*여\s*\d+/g, "").replace(/\s*·\s*남\s*\d+\s*·\s*여\s*\d+/g, "");
      const details = [
        item.ageRange || item.age ? `${item.ageRange || item.age}` : "",
        item.matchCount !== undefined && item.matchCount !== "" && !/매칭\s*\d+\s*명/.test(String(body)) ? `매칭 ${item.matchCount}명` : "",
        item.male !== undefined && item.male !== "" ? `남 ${item.male}` : "",
        item.female !== undefined && item.female !== "" ? `여 ${item.female}` : ""
      ].filter(Boolean).join(" · ");
      return details ? `${body} · ${details}` : body;
    }

    function dashboardBoardMessages(value, role) {
      if (Array.isArray(value)) {
        return value.map((item) => ({
          role: item?.role || role || "",
          text: String(item?.text || "").trim(),
          createdAt: Number(item?.createdAt) || 0,
          updatedAt: Number(item?.updatedAt) || 0
        })).filter((item) => item.text);
      }
      const raw = String(value || "").trim();
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return dashboardBoardMessages(parsed, role);
      } catch {}
      return [{ role: role || "", text: raw, createdAt: 0, updatedAt: 0 }];
    }

    function normalizeDashboardBoardAttachments(value) {
      if (Array.isArray(value)) {
        return value.map((file) => ({
          name: String(file?.name || "첨부 파일").trim() || "첨부 파일",
          url: String(file?.url || "").trim(),
          mimeType: String(file?.mimeType || "").trim(),
          size: Number(file?.size) || 0
        })).filter((file) => file.url);
      }
      const raw = String(value || "").trim();
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return normalizeDashboardBoardAttachments(parsed);
      } catch {}
      return [{ name: "첨부 파일", url: raw, mimeType: "", size: 0 }];
    }

    function dashboardBoardMessageTime(message) {
      const time = Number(message?.updatedAt || message?.createdAt || 0);
      return time ? new Date(time).toLocaleString("ko-KR") : "";
    }

    function dashboardBoardMessageHtml(kind, title, text, message = {}, extra = "") {

    function dashboardBoardStatus(item) {
      const status = String(item.status || "").trim();
      if (dashboardBoardMessages(item.replies || item.reply, "admin").length) return "완료";
      return ["접수", "확인"].includes(status) ? status : "접수";
    }

    function dashboardBoardNumberMap() {
      return new Map([...(dashboardData.board || [])]
        .sort((a, b) => (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0))
        .map((item, index) => [String(dashboardItemId(item)), index + 1]));
    }

      const authorThread = followUps.map((message, index) => dashboardBoardMessageHtml("author", `작성자 추가글 ${index + 1}`, message.text, message)).join("");
      const adminThread = replies.map((message, index) => dashboardBoardReplyHtml(message, index)).join("");
      const latestReply = replies.length ? replies[replies.length - 1].text : "";
      const saveLabel = replies.length ? "답변 수정" : "답변 저장";
      return `
        <article class="dashboard-item dashboard-board-card" data-dashboard-item="${htmlAttr(id)}" data-dashboard-board-card="${htmlAttr(id)}">

              <span class="dashboard-title-row"><span class="dashboard-episode-badge">${htmlAttr(number)}</span><strong>${htmlAttr(authorTitle)}</strong></span>

            <div class="dashboard-board-reply-box" data-dashboard-board-reply-box data-reply-index="${replies.length ? htmlAttr(replies.length - 1) : ""}">

              </div>
            </div>
          </div>
        </article>
      `;
